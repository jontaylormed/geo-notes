    if (drawn.kind !== target.kind) return { status: 'bad', message: `You drew a ${drawn.kind}. A ${target.kind} ${K[target.kind].ends}. Pick the ${target.kind[0].toUpperCase() + target.kind.slice(1)} tool.` };
    if (Geom.same(f, target, drawn)) return { status: 'good', message: 'Yes.' };
    if (drawn.kind === 'ray' && Geom.same(f, target, { kind: 'ray', a: drawn.b, b: drawn.a })) {
      return { status: 'almost', message: `Almost. Ray ${want.pts.join('')} starts at ${want.pts[0]}: tap ${want.pts[0]} first.` };
    }
    return { status: 'bad', message: `That ${drawn.kind} goes through different points. Look for ${want.pts.join(' and ')}.` };
  }
  // ---------- Tapping the figure a name describes (diagram input) ----------
  function checkFind(f, want, index, wantIn) {
    const tapped = f.objects[index];
    if (wantIn) {
      if (Geom.lineInPlane(f, tapped.a, tapped.b, wantIn)) return { status: 'good', message: `Yes. ${tapped.a} and ${tapped.b} are both in plane ${wantIn}, so the whole line is.` };
      const at = Geom.lineCrossesAt(f, tapped.a, tapped.b, wantIn);
      return { status: 'bad', message: at ? `That line crosses plane ${wantIn} at ${at} only.` : `That line isn't in plane ${wantIn}.` };
    }
    if (Geom.same(f, obj(want), tapped)) return { status: 'good', message: 'Yes.' };
    if (tapped.kind !== want.kind) return { status: 'bad', message: `That one is a ${tapped.kind}.` };
    if (tapped.kind === 'ray') return { status: 'bad', message: `That ray starts at ${tapped.a}. Ray ${want.pts.join('')} starts at ${want.pts[0]}.` };
    return { status: 'bad', message: `That ${tapped.kind} doesn't go through both ${want.pts.join(' and ')}.` };
  }

  // ---------- Same figure or different? ----------
  function sameReason(f, n1, n2) {
    if (n1.kind === 'plane' && n2.kind === 'plane') {
      const r1 = Geom.resolvePlane(f, n1.pts), r2 = Geom.resolvePlane(f, n2.pts);
      if (r1.label && r2.label) return { same: r1.label === r2.label, why: r1.label === r2.label ? `${n2.pts.join(', ')} are all in plane ${r1.label}.` : 'They are different planes.' };
      const bad = r1.label ? r2 : r1;
      return { same: false, why: bad.error === 'notIn' ? `${bad.pt} isn't in plane ${bad.plane}.` : 'Those points do not name one plane.' };
    }
    const a = obj(n1), b = obj(n2), isSame = Geom.same(f, a, b);
    let why;
    if (a.kind !== b.kind) why = `A ${a.kind} and a ${b.kind} are different kinds of figures.`;
    else if (a.kind === 'line') why = isSame ? 'All of these points are on one line.' : `${[b.a, b.b].find(p => !Geom.onFigure(f, a, p))} isn't on line ${n1.pts.join('')}.`;
    else if (a.kind === 'segment') why = isSame ? 'Same two endpoints, so the same segment.' : 'Different endpoints, so different segments.';
    else if (!isSame && a.a !== b.a) why = 'Different endpoints, so different rays.';
    else why = isSame ? 'Same endpoint, same direction.' : 'Same endpoint, but opposite directions.';
    return { same: isSame, why };
  }

  // ---------- Claims for find-the-mistake ----------
  function claimTruth(f, c) {
    if (c.c === 'same') return Geom.same(f, obj(c.n1), obj(c.n2));
    if (c.c === 'ends') return { segment: 2, ray: 1, line: 0 }[c.f.kind] === c.n;
    if (c.c === 'collinear') return Geom.collinearPts(f, ...c.pts);
    if (c.c === 'lineIn') return Geom.lineInPlane(f, c.n.pts[0], c.n.pts[1], c.plane);
    if (c.c === 'inPlane') return Geom.inPlane(f, c.plane, c.pt);
    if (c.c === 'crosses') return Geom.lineCrossesAt(f, c.n.pts[0], c.n.pts[1], c.plane) === c.at;
    if (c.c === 'pairIs') return Geom.anglePair(f, c.g, c.h) === c.name;
    if (c.c === 'mEq' || c.c === 'congruent') return Math.abs(Geom.angleDeg(f, ...c.g) - Geom.angleDeg(f, ...c.h)) < 1e-7;
    if (c.c === 'lineRel') { const a = byLabel(f, c.a), b = byLabel(f, c.b); return Geom.lineRelation(f, a.a, a.b, b.a, b.b) === c.rel; }
    if (c.c === 'triSame') return Geom.sameTri(f, c.t1, c.t2);
    if (c.c === 'triRel') return Geom.triStatement(f, c.t, c.u, c.rel);
    if (c.c === 'part') { const p = Geom.circlePart(f, c.circ, f.objects[c.obj]); return p === c.is || (c.is === 'chord' && p === 'diameter'); }
    if (c.c === 'arcIs') return Math.abs(Geom.arcDeg(f, c.arc) - c.deg) < 1e-7;
    if (c.c === 'segEq') { const d = (s) => Math.hypot(Geom.pos(f, s[1]).x - Geom.pos(f, s[0]).x, Geom.pos(f, s[1]).y - Geom.pos(f, s[0]).y); return Math.abs(d(c.s1) - d(c.s2)) < 1e-7; }
    if (c.c === 'angleArc') return Math.abs(Geom.angleDeg(f, ...c.g) - c.k * Geom.arcDeg(f, c.arc)) < 1e-7;
    if (c.c === 'supp') return Math.abs(Geom.angleDeg(f, ...c.g) + Geom.angleDeg(f, ...c.h) - 180) < 1e-7;
    if (c.c === 'mMul') return Math.abs(Geom.angleDeg(f, ...c.g) - c.k * Geom.angleDeg(f, ...c.h)) < 1e-7;
    if (c.c === 'mIs') return Math.abs(Geom.angleDeg(f, ...c.g) - c.deg) < 1e-7;
    if (c.c === 'opp') return f.triangles[0].filter(p => p !== c.g[1]).every(p => c.side.includes(p));
    if (c.c === 'triIs') return c.sides ? (c.sides === 'isosceles' ? Geom.triSides(f, c.tri) !== 'scalene' : Geom.triSides(f, c.tri) === c.sides) : Geom.triKind(f, c.tri) === c.angles;
    if (c.c === 'angleSum') return Math.abs(Geom.triAngles(c.tri).reduce((s, g) => s + Geom.angleDeg(f, ...g), 0) - 180) < 1e-7;
    if (c.c === 'ext') return Math.abs(Geom.angleDeg(f, ...c.ext) - c.parts.reduce((s, g) => s + Geom.angleDeg(f, ...g), 0)) < 1e-7;
    throw new Error('Unknown claim ' + c.c);
  }
  function claimWhy(f, c) {
    if (c.c === 'ends') return `A ${c.f.kind} ${K[c.f.kind].ends}.`;
    if (c.c === 'inPlane') return claimTruth(f, c) ? `${c.pt} is in plane ${c.plane}.` : `${c.pt} is outside plane ${c.plane}, above it.`;
    if (c.c === 'lineIn') return claimTruth(f, c) ? `${c.n.pts.join(' and ')} are both in plane ${c.plane}.` : `Not both of ${c.n.pts.join(' and ')} are in plane ${c.plane}.`;
    if (c.c === 'crosses') return `Only ${c.at} is in plane ${c.plane}, so the line meets the plane at ${c.at}.`;
    if (c.c === 'pairIs') return chooseAnswer(f, { c: 'pair', g: c.g, h: c.h }).why;
    if (c.c === 'lineRel') { const a = byLabel(f, c.a), b = byLabel(f, c.b); return `Lines ${c.a} and ${c.b}: ` + chooseAnswer(f, { c: 'lineRel', l: [a.a, a.b], m: [b.a, b.b] }).why; }
    if (c.c === 'mEq' || c.c === 'congruent') {
      const p = Geom.anglePair(f, c.g, c.h), rel = Geom.pairRelation(f, p);
      return rel === 'supplementary' ? `They are ${pairWords(p)}, so they are supplementary, not congruent.` : `Their measures are ${claimTruth(f, c) ? 'equal' : 'different'}.`;
    }
    if (c.c === 'same') return sameReason(f, c.n1, c.n2).why;
    if (c.c === 'triSame') return 'Same three vertices, so the same triangle.';
    if (c.c === 'part') return chooseAnswer(f, { c: 'circlePart', circ: c.circ, obj: c.obj }).why + (c.is === 'chord' && claimTruth(f, c) ? ' A diameter is a chord too.' : '');
    if (c.c === 'arcIs') return `It measures ${Math.round(Geom.arcDeg(f, c.arc))}°.${Geom.arcKind(f, c.arc) === 'major' ? ' A major arc is 360° minus its minor arc.' : ''}`;
    if (c.c === 'segEq') return claimTruth(f, c) ? 'Tangent segments from the same point are congruent.' : `${c.s2.join('')} goes to the center, not to a point of tangency, so it is longer.`;
    if (c.c === 'angleArc') return 'An inscribed angle is half its intercepted arc.';
    if (c.c === 'supp') return 'They form a linear pair, so they add to 180°.';
    if (c.c === 'triRel') return chooseAnswer(f, { c: 'triRel', t: c.t, u: c.u }).why + (c.rel === 'congruent' && !claimTruth(f, c) ? ' Similar triangles aren’t congruent unless the scale factor is 1.' : '');
    if (c.c === 'opp') return claimTruth(f, c) ? `${c.side.join('')} doesn't touch ${c.g[1]}.` : `${c.side.join('')} touches the vertex, ${c.g[1]}. The opposite side is ${f.triangles[0].filter(p => p !== c.g[1]).join('')}.`;
    if (c.c === 'triIs') {
      if (c.angles) return triAngleWhy(f, c.tri);
      const s = Geom.triSides(f, c.tri);
      return s === 'equilateral' ? 'All three sides are congruent, so it is equilateral, and isosceles too.' : SIDE_WHY[s];
    }
    if (c.c === 'angleSum') return 'The three angles of every triangle add to 180°.';
    if (c.c === 'ext') return claimTruth(f, c) ? 'An exterior angle equals the sum of the two angles not next to it.' : `${angleText(c.parts[1])} is next to ${angleText(c.ext)}: together they make a line. Use the two angles not next to it.`;
    return claimTruth(f, c) ? 'They are on one line.' : 'They are not all on one line.';
  }

  // ---------- Build goals ----------
  function goalMet(f, g) {
    if (g.is === 'collinear') return Geom.collinearPts(f, ...g.pts);
    if (g.is === 'between') return Geom.between(f, g.a, g.m, g.b);
    if (g.is === 'opposite') return Geom.opposite(f, g.v, g.a, g.b);
    if (g.is === 'angle') return Math.abs(Geom.angleDeg(f, ...g.pts) - g.deg) < 1e-7;
    if (g.is === 'parallel') return Geom.parallel(f, g.l[0], g.l[1], g.m[0], g.m[1]);
    if (g.is === 'perpendicular') return Geom.perpendicular(f, g.l[0], g.l[1], g.m[0], g.m[1]);
    if (g.is === 'tri') {
      const s = Geom.triSides(f, g.tri);
      const sidesOk = !g.sides || s === g.sides || (g.sides === 'isosceles' && s === 'equilateral');
      return sidesOk && (!g.angles || Geom.triKind(f, g.tri) === g.angles);
    }
    throw new Error('Unknown goal ' + g.is);
  }

  // ---------- More practice: a new naming problem ----------
  function randInt(lo, hi) { return lo + Math.floor(Math.random() * (hi - lo + 1)); }
  function generateName() {
    const kinds = ['segment', 'ray', 'line'];
    const kind = kinds[randInt(0, 2)];
    const letters = ['ABC', 'DEF', 'PQR', 'JKL', 'XYZ'][randInt(0, 4)].split('');
    for (let tries = 0; tries < 200; tries++) {
      const A = { x: randInt(2, 17), y: randInt(2, 11) };
      const d = { x: randInt(-4, 4), y: randInt(-3, 3) };
      if (d.x === 0 && d.y === 0) continue;
      const B = { x: A.x + d.x, y: A.y + d.y };
      const points = { [letters[0]]: A, [letters[1]]: B };
      if (kind !== 'segment') points[letters[2]] = { on: [letters[0], letters[1]], t: 2 };
      const f = fig(points, [{ kind, a: letters[0], b: letters[1] }], { target: 0 });
      const ok = Object.keys(points).every(n => { const P = Geom.pos(f, n); return P.x >= 1 && P.x <= 19 && P.y >= 1 && P.y <= 13; })
        && Math.hypot(d.x, d.y) >= 3;
      if (ok) return { type: 'name', ask: 'Name the ' + kind[0].toUpperCase() + kind.slice(1), fig: f };
    }
    return LEVEL1.lines.tasks[1];
  }

  // ---------- More Practice: new problems for each level, made at random ----------
  // Every problem is built from exact figures, so the engine's answer is always right.
  const pick = a => a[randInt(0, a.length - 1)];
  const inside = (f, lo = 1, hiY = 13) => Object.keys(f.points).every(n => { const P = Geom.pos(f, n); return P.x >= lo && P.x <= 20 - lo && P.y >= lo && P.y <= hiY; });
  const LETTERS = ['ABC', 'DEF', 'PQR', 'JKL', 'XYZ', 'RST', 'MNP', 'GHK'];
  // An expression ax + b, as the engine reads it (src) and as it's written on a figure (text).
  function linExpr(a, b) {
    const xs = a === 1 ? 'x' : a + 'x';
    return { src: `${a}x${b < 0 ? '' : '+'}${b}`, text: `(${xs}${b > 0 ? ' + ' + b : b < 0 ? ' − ' + -b : ''})°` };
  }
  // An expression worth v when x has the given value; `avoid` keeps two expressions different.
  function exprFor(v, x, avoid) {
    const ok = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter(a => a !== avoid && v - a * x >= -60 && v - a * x <= 100);
    const a = ok.length ? pick(ok) : avoid === 2 ? 3 : 2;
    return Object.assign(linExpr(a, v - a * x), { a });
  }
  // The wrong relationship must give a different equation from the right one.
  const differs = (rel, wrong) => !Algebra.sameForm(Algebra.relForm(rel), Algebra.relForm(wrong));

  // Level 1: naming, and same figure or different figures.
  function sameProblem() {
    const L = pick(LETTERS).split('');
    for (let tries = 0; tries < 200; tries++) {
      const A = { x: randInt(2, 12), y: randInt(2, 10) }, d = { x: randInt(1, 4), y: randInt(-2, 3) };
      const f = fig({ [L[0]]: A, [L[1]]: { x: A.x + d.x, y: A.y + d.y }, [L[2]]: { on: [L[0], L[1]], t: 2 } }, []);
      if (!inside(f) || Math.hypot(d.x, d.y) < 2.5) continue;
      const [a, b, c] = L, n = (k, s) => ({ kind: k, pts: s.split('') });
      const q = pick([
        ['line', n('line', a + b), n('line', c + a)], ['line', n('line', b + c), n('line', a + b)],
        ['ray', n('ray', a + b), n('ray', a + c)], ['ray', n('ray', b + a), n('ray', b + c)], ['ray', n('ray', a + b), n('ray', b + a)],
        ['segment', n('segment', a + b), n('segment', b + a)], ['segment', n('segment', a + b), n('segment', a + c)],
      ]);
      f.objects = [q[0] === 'segment' ? { kind: 'segment', a, b: c } : { kind: 'line', a, b }];
      const word = q[0][0].toUpperCase() + q[0].slice(1);
      return { type: 'same', ask: `Same ${word} or Different ${word}s?`, n1: q[1], n2: q[2], fig: f };
    }
    return LEVEL1.lines.tasks[3];
  }

  // Level 2: an angle with whole-degree rays from a vertex.
  function angleFig(deg, targetName) {
    for (let tries = 0; tries < 200; tries++) {
      const L = pick(LETTERS).split(''), V = { x: randInt(6, 13), y: randInt(3, 9) }, d1 = randInt(0, 359);
      const f = fig({ [L[1]]: V, [L[0]]: polar(V, randInt(5, 7), d1), [L[2]]: polar(V, randInt(5, 8), d1 + deg) },
        [{ kind: 'ray', a: L[1], b: L[0] }, { kind: 'ray', a: L[1], b: L[2] }], { angles: [L] });
      if (targetName) f.targetAngle = L;
      if (inside(f)) return f;
    }
    return null;
  }
  function crossAlgebra() {
    const x = randInt(5, 20);
    if (Math.random() < 0.5) {
      const v = pick([40, 50, 55, 65, 70, 75, 80, 100, 105, 110, 115, 125, 130]);
      const e1 = exprFor(v, x), e2 = exprFor(v, x, e1.a);
      const rel = { is: 'equal', a: e1.src, b: e2.src }, wrong = { is: 'sum', parts: [e1.src, e2.src], total: 180 };
      if (!differs(rel, wrong)) return crossAlgebra();
      return { type: 'algebra', ask: 'Find m∠AEB.', fig: Object.assign(CROSSD(v), { labels: [ang('AEB', e1.text), ang('CED', e2.text)] }),
        rel, find: { name: 'AEB', expr: e1.src, angle: true }, hint: '∠AEB and ∠CED are vertical angles.',
        wrong: [{ rel: wrong, why: 'Vertical angles are congruent: their measures are equal, not a sum of 180°.' }] };
    }
    const v = pick([50, 60, 70, 75, 80, 100, 105, 110, 120, 130]), e1 = exprFor(v, x), e2 = exprFor(180 - v, x, e1.a);
    const rel = { is: 'sum', parts: [e1.src, e2.src], total: 180 }, wrong = { is: 'equal', a: e1.src, b: e2.src };
    if (!differs(rel, wrong)) return crossAlgebra();
    return { type: 'algebra', ask: 'Find m∠AEB.', fig: Object.assign(CROSSD(v), { labels: [ang('AEB', e1.text), ang('BEC', e2.text)] }),
      rel, find: { name: 'AEB', expr: e1.src, angle: true }, hint: '∠AEB and ∠BEC are a linear pair.',
      wrong: [{ rel: wrong, why: 'A linear pair adds to 180°. These two angles aren’t equal.' }] };
  }

  // Level 3: parallel lines cut by a transversal, with m∠APE = d.
  const T_ANGLES = ['APE', 'EPB', 'BPQ', 'QPA', 'CQP', 'PQD', 'DQF', 'FQC'];
  function transPair(named) {
    const f = transAt(pick([50, 55, 60, 65, 70, 75, 80, 100, 105, 110, 115, 120, 125, 130]));
    for (;;) {
      const g = A3(pick(T_ANGLES.slice(0, 4))), h = A3(pick(T_ANGLES.slice(4)));
      const p = Geom.anglePair(f, g, h);
      if (p && (!named || named.includes(p))) return { f, g, h, p };
    }
  }
  function transAlgebra() {
    const x = randInt(5, 20), v = pick([50, 55, 60, 65, 70, 75, 80, 100, 105, 110, 115, 120, 125, 130]);
    // Each pair, with which of its angles measure d (the rest measure 180 - d) at m∠APE = d.
    const kinds = [
      { name: 'corresponding', g: 'APE', h: 'CQP', sum: false }, { name: 'alternate interior', g: 'QPA', h: 'PQD', sum: false },
      { name: 'alternate exterior', g: 'APE', h: 'DQF', sum: false }, { name: 'same-side interior', g: 'BPQ', h: 'PQD', sum: true },
    ];
    const k = pick(kinds), f = transAt(k.g === 'QPA' ? 180 - v : v);
    const vg = Geom.angleDeg(f, ...A3(k.g)), vh = Geom.angleDeg(f, ...A3(k.h));
    const e1 = exprFor(Math.round(vg), x), e2 = exprFor(Math.round(vh), x, e1.a);
    const rel = k.sum ? { is: 'sum', parts: [e1.src, e2.src], total: 180 } : { is: 'equal', a: e1.src, b: e2.src };
    const wrong = k.sum ? { is: 'equal', a: e1.src, b: e2.src } : { is: 'sum', parts: [e1.src, e2.src], total: 180 };
    if (!differs(rel, wrong)) return transAlgebra();
    return { type: 'algebra', ask: `Line m ∥ Line n. Find m∠${k.g}.`, fig: Object.assign(f, { labels: [ang(k.g, e1.text), ang(k.h, e2.text)] }),
      rel, find: { name: k.g, expr: e1.src, angle: true }, hint: `∠${k.g} and ∠${k.h} are ${k.name} angles, and m ∥ n.`,
      wrong: [{ rel: wrong, why: k.sum ? 'Same-side interior angles on parallel lines are supplementary: they add to 180°.' : `${k.name[0].toUpperCase() + k.name.slice(1)} angles on parallel lines are congruent, not supplementary.` }] };
  }

  // Level 4: a triangle with whole-degree angles a at A and b at B, placed to fit the grid.
  function fitTri(a, b, names, extra) {
    for (let L = 13; L >= 4; L--) for (let ax = 2; ax <= 18 - L; ax++) {
      const f = triAt({ x: ax, y: 2.5 }, L, a, b, names, extra && JSON.parse(JSON.stringify(extra)));
      if (inside(f, 1.5, 12.5)) return f;
    }
    return null;
  }
  // A triangle of the given kind that fits the grid (new angles until one does).
  function fittedTri(kind, extra) {
    for (;;) {
      const [a, b] = triAngles3(kind), f = fitTri(a, b, 'ABC', extra(a, b));
      if (f) return { f, a, b };
    }
  }
  // Whole-degree angles at A and B for a triangle of the given kind (the third angle is 180 - a - b).
  function triAngles3(kind) {
    if (kind === 'right') { const r = randInt(25, 65); return pick([[90, r], [r, 90], [r, 90 - r]]); }
    for (;;) {
      const a = randInt(25, 115), b = randInt(25, 115), c = 180 - a - b;
      if (c < 20) continue;
      const k = [a, b, c].includes(90) ? 'right' : Math.max(a, b, c) > 90 ? 'obtuse' : 'acute';
      if (k === kind) return [a, b];
    }
  }
  function sideTri() {
    const kind = pick(['scalene', 'isosceles', 'equilateral']), L = pick(LETTERS);
    if (kind === 'equilateral') return fitTri(60, 60, L);
    for (let tries = 0; tries < 400; tries++) {
      const A = { x: randInt(2, 10), y: randInt(2, 5) }, B = { x: A.x + 2 * randInt(3, 5), y: A.y };
      const C = kind === 'isosceles' ? { x: (A.x + B.x) / 2, y: A.y + randInt(3, 9) } : { x: randInt(2, 18), y: randInt(6, 12) };
      const f = TRI(A, B, C, L);
      if (inside(f) && !Geom.collinearPts(f, ...L.split('')) && Geom.triSides(f, L.split('')) === kind) return f;
    }
    return fitTri(60, 60, L);
  }
  function triAlgebra() {
    const x = randInt(5, 15), [a, b] = triAngles3(pick(['acute', 'obtuse'])), c = 180 - a - b;
    const e1 = exprFor(a, x), e2 = exprFor(b, x, e1.a);
    const rel = { is: 'sum', parts: [e1.src, e2.src, String(c)], total: 180 }, wrong = { is: 'equal', a: e1.src, b: e2.src };
    const f = fitTri(a, b, 'ABC', { labels: [ang('CAB', e1.text), ang('ABC', e2.text), ang('BCA', c + '°')] });
    if (!f || f.points.B.x - f.points.A.x < 8 || !differs(rel, wrong)) return triAlgebra();   // a base wide enough to hold both expressions
    return { type: 'algebra', ask: 'Find m∠CAB.', fig: f, rel, find: { name: 'CAB', expr: e1.src, angle: true },
      hint: 'The three angles of a triangle add to 180°.', wrong: [{ rel: wrong, why: 'These angles aren’t marked congruent. The three angles of a triangle add to 180°.' }] };
  }

  // Two triangles that are congruent (moved, maybe flipped), similar (scale factor 2) or neither,
  // with △DEF's letters in a random order so the statement's order has to be worked out.
  function pairProblem(kind) {
    for (;;) {
      const base = [p2(0, 0), p2(randInt(3, 4), randInt(0, 1)), p2(randInt(0, 3), randInt(3, 4))];
      const flip = Math.random() < 0.5;
      const moved = kind === 'similar' ? base.map(P => p2(10 + 2 * P.x, 1 + 2 * P.y))

    // Twice round: the second time, each one sees where the others settled.
    // An angle's expression has first call on the space beside its vertex; an arc's measure then
    // takes the best place left along its arc (outside the circle, or just inside it).
    arcsYield = true;
    for (const t of rays) settle(t, false);
    arcsYield = false;
    for (const t of arcs) settleArc(t);
    for (const t of rays) if (room(t) < NEED) settle(t, small(t));

    // Expressions that share a tight space are written the same size; so are all of a triangle's.
    const beside = (a, b) => gap(a.getBoundingClientRect(), b.getBoundingClientRect()) < 45 * k;
    const shrink = list => { for (const t of list) { if (t._ray) settle(t, true); else t.classList.add('snug'); } };
    shrink(all.filter(e => !small(e) && all.some(o => o !== e && small(o) && beside(e, o))));
    for (const tri of fig.triangles || []) {
      const own = rays.filter(e => e._pts.every(n => tri.includes(n)));
      if (own.some(small)) shrink(own.filter(e => !small(e)));
    }
    // Shrinking one can free room for its neighbor: a last look at any that are still crowded.
    for (const t of arcs) if (room(t) < NEED) settleArc(t);
    for (const t of rays) if (room(t) < NEED) settle(t, true);
  }
  // Angle marks: a box on a right angle; arcs on congruent angles (one arc for the first group,
  // two for the next); a shaded wedge on the angle a task is about.
  function drawAngles() {
    if (!(fig.angles || []).length) return;
    const g = el('g', { class: 'angle-marks', 'aria-hidden': 'true' }, layerObjs);
    const m = Geom.measureAngles(fig);
    for (const a of m.angles) {
      const V = Geom.pos(fig, a.pts[1]);
      const cx = X(V.x), cy = Y(V.y);
      const dir = p => { const P = Geom.pos(fig, p), dx = X(P.x) - cx, dy = Y(P.y) - cy, l = Math.hypot(dx, dy); return { x: dx / l, y: dy / l }; };
      const u = dir(a.pts[0]), w = dir(a.pts[2]);
      const target = [opts.hlAngle].concat(opts.hlAngles || []).some(h => h && Geom.sameAngle(fig, h, a.pts));
      if (target) {
        // Under the lines, so the highlighted angle never hides them.
        const under = el('g', { 'aria-hidden': 'true' });
        layerObjs.insertBefore(under, layerObjs.firstChild);
        el('path', { d: wedge(cx, cy, u, w, 34), class: 'angle-hl' }, under);
      }
      if (a.kind === 'right' && !opts.hideMeasures) {
        const s = 12;
        el('path', { d: `M${cx + u.x * s},${cy + u.y * s} L${cx + (u.x + w.x) * s},${cy + (u.y + w.y) * s} L${cx + w.x * s},${cy + w.y * s}`, class: 'right-box' }, g);
      } else if (a.arcs && !opts.hideMeasures && congMarks) {
        for (let k = 0; k < Math.min(a.arcs, 4); k++) el('path', { d: arc(cx, cy, u, w, 24 + k * 6), class: 'arc' }, g);
      }
    }
  }
  function arc(cx, cy, u, w, r) {
    const sweep = u.x * w.y - u.y * w.x > 0 ? 1 : 0;
    return `M${cx + u.x * r},${cy + u.y * r} A${r},${r} 0 0 ${sweep} ${cx + w.x * r},${cy + w.y * r}`;
  }
  function wedge(cx, cy, u, w, r) { return `M${cx},${cy} L${cx + u.x * r},${cy + u.y * r} ` + arc(cx, cy, u, w, r).replace(/^M[^A]*/, '') + ' Z'; }
  // Tick marks on congruent segments: one tick for the first group, two for the next, and so on,
  // crossing the middle of each segment. The Measurements panel says the same thing in words.
  function drawTicks() {
    const g = el('g', { class: 'ticks', 'aria-hidden': 'true' }, layerObjs);
    for (const s of Geom.measure(fig, opts.drawn || []).segments) {
      if (!s.ticks || opts.hideMeasures || !congMarks || (fig.angles && !fig.triangles && !fig.ticks)) continue;
      const A = Geom.pos(fig, s.pts[0]), B = Geom.pos(fig, s.pts[1]);
      const mx = X((A.x + B.x) / 2), my = Y((A.y + B.y) / 2);
      const dx = X(B.x) - X(A.x), dy = Y(B.y) - Y(A.y), len = Math.hypot(dx, dy);
      const ux = dx / len, uy = dy / len, nx = -uy, ny = ux;
      const n = Math.min(s.ticks, 4), gap = 6, half = 8;
      for (let k = 0; k < n; k++) {
        const off = (k - (n - 1) / 2) * gap;
        const cx = mx + ux * off, cy = my + uy * off;
        el('line', { x1: cx - nx * half, y1: cy - ny * half, x2: cx + nx * half, y2: cy + ny * half }, g);
      }
    }
    // Congruent arcs: tick marks across the circle at each arc's middle, one tick for the first
    // group, two for the next. The Congruent panel lists them in words.
    if (opts.hideMeasures || !congMarks) return;
    Geom.congruentArcs(fig).forEach((group, i) => {
      for (const a of group) {
        const C = Geom.pos(fig, a.c), cx = X(C.x), cy = Y(C.y), r = Geom.radius(fig, a.c) * U;
        const m = arcPath(a).mid, l = Math.hypot(m.x - cx, m.y - cy), ux = (m.x - cx) / l, uy = (m.y - cy) / l;
        const n = Math.min(i + 1, 4);
        for (let k = 0; k < n; k++) {
          const t = (k - (n - 1) / 2) * 6 / r, c = Math.cos(t), s = Math.sin(t);
          const vx = ux * c - uy * s, vy = ux * s + uy * c;    // the middle direction, turned a little for each extra tick
          el('line', { x1: cx + vx * (r - 7), y1: cy + vy * (r - 7), x2: cx + vx * (r + 7), y2: cy + vy * (r + 7) }, g);
        }
      }
    });
  }

  // ---------- Points ----------
  function makeHandle(name) {
    const g = el('g', { class: 'pt', tabindex: '0', role: 'button', 'data-pt': name }, layerPts);
    el('circle', { r: 18, class: 'hit' }, g);
    el('circle', { r: 5.5, class: 'dot' }, g);
    const t = el('text', { class: 'lbl', 'aria-hidden': 'true' }, g);
    t.textContent = name;
    g.addEventListener('pointerdown', e => onPointDown(e, name));
    g.addEventListener('keydown', e => onPointKey(e, name));
    return g;
  }
  function placeHandle(name) {
    const g = handles[name], P = Geom.pos(fig, name);
    g.setAttribute('transform', `translate(${X(P.x)},${Y(P.y)})`);
    const lbl = g.querySelector('text');
    // A triangle's vertex letter goes outside the triangle, away from its center, so it never sits
    // on the angle marks inside. Other letters go up and to the right unless that runs off the edge.
    const t = (fig.triangles || []).find(x => x.includes(name));
    // Points on a circle get their letter outside the circle, away from the center.
    const k = !t && (fig.circles || []).find(c => c.c !== name && Geom.onCircle(fig, c.c, name));
    // A figure can set a letter's direction (screen x right, y down), like a vertex two triangles share.
    const dir = fig.labelDir && fig.labelDir[name];
    if (dir) {
      lbl.setAttribute('x', dir[0] * 17 - 6);
      lbl.setAttribute('y', dir[1] * 17 + 7);
    } else if (t || k) {
      const c = k ? Geom.pos(fig, k.c) : t.map(n => Geom.pos(fig, n)).reduce((s, Q) => ({ x: s.x + Q.x / 3, y: s.y + Q.y / 3 }), { x: 0, y: 0 });
      let dx = X(P.x) - X(c.x), dy = Y(P.y) - Y(c.y); const l = Math.hypot(dx, dy) || 1;
      dx /= l; dy /= l;
      lbl.setAttribute('x', dx * 17 - 6);
      lbl.setAttribute('y', dy * 17 + 7);
    } else {
      lbl.setAttribute('x', P.x > Geom.W - 2.5 ? -18 : 9);
      lbl.setAttribute('y', P.y > Geom.H - 2 ? 22 : -10);
    }
    const can = tool === 'move' ? movable(name) : tool !== 'pick';
    g.classList.toggle('movable', tool === 'move' && movable(name));
    g.classList.toggle('first', first === name);
    g.setAttribute('aria-disabled', can ? 'false' : 'true');
    const how = tool === 'move' ? (movable(name) ? ' Arrow keys move it.' : '') : tool === 'pick' ? '' : first === name ? ' Selected.' : ' Enter selects it.';
    g.setAttribute('aria-label', `Point ${name} at ${Geom.round2(P.x)}, ${Geom.round2(P.y)}.${how}`);
    g.setAttribute('tabindex', tool === 'pick' ? '-1' : '0');
  }

  function choosePoint(name) {
    if (!['segment', 'ray', 'line'].includes(tool)) return;
    if (!first) { first = name; redraw(); if (cb.onFirst) cb.onFirst(name); return; }
    if (first === name) { first = null; redraw(); return; }
    const drawn = { kind: tool, a: first, b: name };
    first = null;
    redraw();
    if (cb.onDraw) cb.onDraw(drawn);
  }

  function onPointDown(e, name) {
    if (tool !== 'move') { e.preventDefault(); choosePoint(name); return; }
    if (!movable(name)) return;
    e.preventDefault();
    handles[name].focus({ preventScroll: true });   // preventDefault skips focus; without it, arrow keys after a click scroll the page
    drag = { name, id: e.pointerId, moved: false };
    try { handles[name].setPointerCapture(e.pointerId); } catch (err) { /* the svg still tracks the drag */ }
    handles[name].classList.add('dragging');
  }
  function toModel(e) {
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: p.x / U, y: (HPX - p.y) / U };
  }
  function onPointerMove(e) {
    if (!drag || e.pointerId !== drag.id) return;
    const next = Geom.snapMove(fig, drag.name, toModel(e), opts.magnets || []);
    if (!next) return;
    const cur = fig.points[drag.name];
    if (JSON.stringify(cur) === JSON.stringify(next)) return;
    fig.points[drag.name] = next;
    drag.moved = true;
    redraw();
    if (cb.onMove) cb.onMove(drag.name, false);
  }
  function endDrag(e) {
    if (!drag || (e && e.pointerId !== drag.id)) return;
    const { name, moved } = drag;
    handles[name].classList.remove('dragging');
    drag = null;
    if (moved && cb.onMove) cb.onMove(name, true);
  }
  function onPointKey(e, name) {
    const dirs = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] };
    if ((e.key === 'Enter' || e.key === ' ') && tool !== 'move') { e.preventDefault(); choosePoint(name); return; }
    if (!dirs[e.key] || tool !== 'move' || !movable(name)) return;
    e.preventDefault();
    const next = Geom.keyMove(fig, name, dirs[e.key][0], dirs[e.key][1], opts.magnets || []);
    if (!next) { if (cb.onBlocked) cb.onBlocked(name); return; }
    fig.points[name] = next;
    redraw();
    handles[name].focus();
    if (cb.onMove) cb.onMove(name, true);
  }

  return { mount, load, setTool, redraw, setCongMarks, audit, get tool() { return tool; } };
})();
</script>
<script>/* Tests for the geometry engine, notation and lessons. Open geo-notes-tests.html; results show on
   the page and in window.testSummary. */
(() => {
  'use strict';
  const results = [];
  const LV = key => Tasks.LEVELS.find(l => l.key === key);
  const t = (name, fn) => {
    try { const r = fn(); results.push({ name, ok: r === true, info: r === true ? '' : String(r) }); }
    catch (e) { results.push({ name, ok: false, info: 'threw: ' + e.message }); }
  };
  const L = (a, b) => ({ kind: 'line', a, b }), S = (a, b) => ({ kind: 'segment', a, b }), R = (a, b) => ({ kind: 'ray', a, b });
  // A(8,5) B(12,7) C(16,9) E(4,3) are on one line; D(3,9) is not.
  const F = { points: { A: { x: 8, y: 5 }, B: { x: 12, y: 7 }, C: { on: ['A', 'B'], t: 2 }, D: { x: 3, y: 9 }, E: { on: ['A', 'B'], t: -1 } }, objects: [] };

  // ---------- Which figure a name describes ----------
  t('line from any two of its points', () => Geom.same(F, L('A', 'B'), L('C', 'A')) && Geom.same(F, L('A', 'B'), L('B', 'C')) || 'failed');
  t('line through an off-line point is different', () => !Geom.same(F, L('A', 'B'), L('A', 'D')) || 'failed');
  t('segment AB is segment BA', () => Geom.same(F, S('A', 'B'), S('B', 'A')) || 'failed');
  t('segment AB is not segment AC', () => !Geom.same(F, S('A', 'B'), S('A', 'C')) || 'failed');
  t('ray AB is not ray BA', () => !Geom.same(F, R('A', 'B'), R('B', 'A')) || 'failed');
  t('ray AB is ray AC when C is past B', () => Geom.same(F, R('A', 'B'), R('A', 'C')) || 'failed');
  t('ray AB is not ray AE when E is behind A', () => !Geom.same(F, R('A', 'B'), R('A', 'E')) || 'failed');
  t('different kinds are never the same', () => !Geom.same(F, L('A', 'B'), R('A', 'B')) && !Geom.same(F, S('A', 'B'), L('A', 'B')) || 'failed');
  t('all names of a line', () => Geom.names(F, L('A', 'B')).length === 12 || Geom.names(F, L('A', 'B')).length);   // 4 points: 4 x 3 ordered pairs
  t('all names of ray AB', () => Geom.names(F, R('A', 'B')).map(p => p.join('')).sort().join() === 'AB,AC' || JSON.stringify(Geom.names(F, R('A', 'B'))));
  t('segment names use endpoints only', () => Geom.names(F, S('A', 'C')).map(p => p.join('')).join() === 'AC,CA' || 'failed');
  t('opposite rays', () => Geom.opposite(F, 'A', 'B', 'E') && !Geom.opposite(F, 'A', 'B', 'C') || 'failed');
  t('between', () => Geom.between(F, 'A', 'B', 'C') && !Geom.between(F, 'A', 'C', 'B') && !Geom.between(F, 'A', 'D', 'B') || 'failed');
  t('point on a segment, ray, line', () => Geom.onFigure(F, S('A', 'C'), 'B') && !Geom.onFigure(F, S('A', 'B'), 'C') && Geom.onFigure(F, R('A', 'B'), 'C') && !Geom.onFigure(F, R('A', 'B'), 'E') && Geom.onFigure(F, L('A', 'B'), 'E') || 'failed');
  t('built points stay on their line when an anchor moves', () => {
    const f = JSON.parse(JSON.stringify(F));
    f.points.B = { x: 9, y: 3 };
    return Geom.collinearPts(f, 'A', 'B', 'C') && Geom.collinearPts(f, 'A', 'B', 'E') || 'failed';
  });

  // ---------- Moving points ----------
  t('free points snap to the grid', () => { const n = Geom.snapMove(F, 'D', { x: 4.3, y: 7.8 }); return n.x === 4 && n.y === 8 || JSON.stringify(n); });
  t('a point can not land on another point', () => Geom.snapMove(F, 'D', { x: 8.2, y: 5.1 }) === null || 'allowed');
  t('an anchor can not push a built point off the grid', () => Geom.snapMove(F, 'B', { x: 18, y: 12 }) === null || 'allowed');
  t('points stay on the grid', () => Geom.snapMove(F, 'D', { x: 30, y: 40 }).x <= 19 || 'off grid');
  t('a magnet line pulls a point exactly onto it', () => {
    const f = { points: { A: { x: 3, y: 4 }, B: { x: 7, y: 6 }, D: { x: 14, y: 4 } }, objects: [] };
    const n = Geom.snapMove(f, 'D', { x: 11.1, y: 8.3 }, [['A', 'B']]);
    const g = { points: Object.assign({}, f.points, { D: n }), objects: [] };
    return Geom.collinearPts(g, 'A', 'B', 'D') || JSON.stringify(n);
  });
  t('a point on a line slides along it', () => {
    const n = Geom.snapMove(F, 'C', { x: 14.5, y: 8.6 });
    const g = { points: Object.assign({}, F.points, { C: n }), objects: [] };
    return (n.on && Geom.collinearPts(g, 'A', 'B', 'C')) || JSON.stringify(n);
  });
  t('arrow keys move a free point one unit', () => { const n = Geom.keyMove(F, 'D', 1, 0); return n.x === 4 && n.y === 9 || JSON.stringify(n); });

  // ---------- Measurements and congruence ----------
  // A(1,1) B(4,5) is length 5; C(7,1) D(10,5) is length 5; E(2,8) F(4,9) is sqrt 5.
  const MF = { points: { A: { x: 1, y: 1 }, B: { x: 4, y: 5 }, C: { x: 7, y: 1 }, D: { x: 10, y: 5 }, E: { x: 2, y: 8 }, F: { x: 4, y: 9 } },
    objects: [S('A', 'B'), S('C', 'D'), S('E', 'F')] };
  t('segment lengths', () => { const m = Geom.measure(MF); const ab = m.segments.find(s => s.pts.join('') === 'AB'); return ab.text === '5' && ab.exact || JSON.stringify(ab); });
  t('an inexact length is marked as rounded', () => { const ef = Geom.measure(MF).segments.find(s => s.pts.join('') === 'EF'); return !ef.exact && ef.text === '2.2' || JSON.stringify(ef); });
  t('congruent segments are grouped exactly', () => JSON.stringify(Geom.measure(MF).congruent) === '[[["A","B"],["C","D"]]]' || JSON.stringify(Geom.measure(MF).congruent));
  t('points on a line give every segment between them', () => Geom.measure(F, [L('A', 'B')]).segments.map(s => s.pts.join('')).join() === 'AB,AC,AE,BC,BE,CE' || Geom.measure(F, [L('A', 'B')]).segments.map(s => s.pts.join('')).join());
  t('lengths that would round alike get another decimal', () => {
    // AB = sqrt(41) = 6.403..., CD = 6.4: both round to 6.4, but they are not congruent.
    const f = { points: { A: { x: 1, y: 1 }, B: { x: 5, y: 6 }, C: { x: 10, y: 1 }, D: { x: 16.4, y: 1 } }, objects: [S('A', 'B'), S('C', 'D')] };
    const m = Geom.measure(f);
    const t1 = m.segments.find(s => s.pts.join('') === 'AB').text, t2 = m.segments.find(s => s.pts.join('') === 'CD').text;
    return t1 !== t2 || `${t1} and ${t2} look equal`;
  });
  t('tick marks: each congruent group gets its own count, non-congruent get none', () => {
    const f = { points: { A: { x: 1, y: 1 }, B: { x: 4, y: 5 }, C: { x: 7, y: 1 }, D: { x: 10, y: 5 }, E: { x: 1, y: 9 }, F: { x: 3, y: 9 }, G: { x: 6, y: 9 }, H: { x: 8, y: 9 }, J: { x: 12, y: 2 }, K: { x: 13, y: 9 } },
      objects: [S('A', 'B'), S('C', 'D'), S('E', 'F'), S('G', 'H'), S('J', 'K')] };
    const t1 = Object.fromEntries(Geom.measure(f).segments.map(s => [s.pts.join(''), s.ticks || 0]));
    return t1.AB === 1 && t1.CD === 1 && t1.EF === 2 && t1.GH === 2 && t1.JK === 0 || JSON.stringify(t1);
  });
  t('a length that moves stops being congruent', () => {
    const f = JSON.parse(JSON.stringify(MF)); f.points.D = { x: 10, y: 6 };
    return Geom.measure(f).congruent.length === 0 || 'still congruent';
  });

  // ---------- Notation ----------
  const p = s => { const r = Notation.parse(s); return r.error ? 'error' : `${r.kind}:${(r.pts || []).join('')}`; };
  t('reads loose spellings', () => {
    const cases = { 'segment AB': 'segment:AB', 'seg ab': 'segment:AB', 'line segment BA': 'segment:BA', 'ray BA': 'ray:BA', 'Line cd': 'line:CD', 'AB': 'null:AB', 'ray A B': 'ray:AB', '→AB': 'ray:AB', '<->PQ': 'line:PQ' };
    for (const [k, v] of Object.entries(cases)) if (p(k) !== v) return `${k} read as ${p(k)}`;
    return true;
  });
  t('rejects names that are not two points', () => ['ray A', 'segment ABC', 'line AA', '', 'ray 12'].every(s => p(s) === 'error') || 'accepted one');
  t('notes lowercase letters', () => Notation.parse('ray ab').lowercase === true && !Notation.parse('ray AB').lowercase || 'failed');
  t('speaks a name', () => Notation.speak('ray', ['A', 'B']) === 'ray A B' || Notation.speak('ray', ['A', 'B']));

  // ---------- Checking answers ----------
  const f1 = Tasks.LEVEL1.rays.tasks[1].fig;
  t('typed ray, correct', () => Tasks.checkName(f1, f1.objects[0], 'ray DE').status === 'good' || 'failed');
  t('typed ray, backwards is Almost', () => Tasks.checkName(f1, f1.objects[0], 'ray ED').status === 'almost' || 'failed');
  t('typed a line for a ray', () => Tasks.checkName(f1, f1.objects[0], 'line DE').status === 'bad' || 'failed');
  t('bare AB asks which figure', () => Tasks.checkName(f1, f1.objects[0], 'DE').status === 'ask' || 'failed');
  t('unknown point', () => /no point Q/.test(Tasks.checkName(f1, f1.objects[0], 'ray DQ').message) || 'failed');

  // ---------- Planes ----------
  const PL = { points: { A: { x: 4, y: 3 }, B: { x: 8, y: 5 }, C: { on: ['A', 'B'], t: 2 }, D: { x: 13, y: 3 }, E: { x: 9, y: 12 } }, objects: [],
    planes: [{ label: 'M', pts: ['A', 'B', 'D'], quad: [[2, 2], [13, 2], [18, 9], [7, 9]] }] };
  const planeName = s => Tasks.checkName(PL, { kind: 'plane', label: 'M' }, s).status;
  t('plane by its letter', () => planeName('plane M') === 'good' || planeName('plane M'));
  t('plane by three points, any order', () => ['plane ABD', 'plane DBA', 'plane CDA'].every(s => planeName(s) === 'good') || 'rejected one');
  t('a point on a line in the plane is in the plane', () => Geom.inPlane(PL, 'M', 'C') || 'failed');
  t('three collinear points do not name a plane', () => planeName('plane ABC') === 'almost' || planeName('plane ABC'));
  t('a point outside the plane', () => /E isn't in plane M/.test(Tasks.checkName(PL, { kind: 'plane', label: 'M' }, 'plane ABE').message) || 'failed');
  t('a plane needs one letter or three points', () => Notation.parse('plane AB').error && !Notation.parse('plane M').error && !Notation.parse('plane ABC').error || 'failed');
  t('a line lies in a plane when two of its points do', () => Geom.lineInPlane(PL, 'A', 'D', 'M') && !Geom.lineInPlane(PL, 'A', 'E', 'M') || 'failed');
  t('a line through one point of a plane crosses it there', () => Geom.lineCrossesAt(PL, 'E', 'D', 'M') === 'D' && Geom.lineCrossesAt(PL, 'A', 'D', 'M') === null || 'failed');
  t('a plane letter is correct on every plane task', () => Object.values(Tasks.LEVEL1.planes.tasks).filter(x => x.type === 'name').every(x => Tasks.checkName(x.fig, { kind: 'plane', label: x.fig.targetPlane }, 'plane ' + x.fig.targetPlane).status === 'good') || 'a letter was rejected');

  // ---------- Capital and lowercase letters (a learning target) ----------
  const LK = { points: { G: { x: 3, y: 10 }, H: { x: 12, y: 4 } }, objects: [{ kind: 'line', a: 'G', b: 'H', label: 'k' }] };
  const lineName = s => Tasks.checkName(LK, LK.objects[0], s);

    return n > 200 && !bad.length || `${bad.length} of ${n}: ` + bad.slice(0, 4).join('; ');
  });
  t('the same on new More Practice and Common Mistakes questions (40 of each kind; at most 1 in 300 may fail)', () => {
    const bad = [], kinds = []; let n = 0;
    const tryOne = (name, make) => { let own = 0; for (let i = 0; i < 40; i++) { const task = make(); if (!task || !task.fig) continue; n++; const a = drawn(task.fig, task); if (a && a.length) { own++; bad.push(`${name}: ${a[0]}`); } } if (own > 1) kinds.push(`${name} (${own} of 40)`); };
    for (const key of Object.keys(Tasks.PRACTICE)) Tasks.PRACTICE[key].forEach((g, i) => tryOne(`More Practice ${key}.${i + 1}`, g));
    for (const grp of Tasks.MISTAKES) grp.list.forEach((m, i) => tryOne(`Common Mistakes ${grp.key}.${i + 1}`, m.gen));
    // No one kind may fail more than once in 40, and no more than 1 in 300 overall.
    return n > 1000 && !kinds.length && bad.length <= n / 300 || `${bad.length} of ${n}; kinds: ${kinds.join(', ') || 'none'}; ` + bad.slice(0, 4).join('; ');
  });
  // The same two sweeps again with the diagram at laptop size: writing is placed by measuring, so each size is its own case.
  document.getElementById('svg').style.width = '551px';
  t('at laptop width too: every lesson and Algebra Connections figure', () => {
    const bad = []; let n = 0;
    for (const Lv of Tasks.LEVELS) {
      const tasks = [].concat(...Object.keys(Lv.parts || {}).map(k => Lv.parts[k].tasks || []), Lv.algebra || []);
      tasks.forEach((task, i) => { if (!task.fig) return; n++; const a = drawn(task.fig, task); if (a && a.length) bad.push(`${Lv.key} #${i + 1}: ${a[0]}`); });
    }
    return n > 200 && !bad.length || `${bad.length} of ${n}: ` + bad.slice(0, 4).join('; ');
  });
  t('at laptop width too: new More Practice and Common Mistakes questions (40 of each kind)', () => {
    const bad = [], kinds = []; let n = 0;
    const tryOne = (name, make) => { let own = 0; for (let i = 0; i < 40; i++) { const task = make(); if (!task || !task.fig) continue; n++; const a = drawn(task.fig, task); if (a && a.length) { own++; bad.push(`${name}: ${a[0]}`); } } if (own > 1) kinds.push(`${name} (${own} of 40)`); };
    for (const key of Object.keys(Tasks.PRACTICE)) Tasks.PRACTICE[key].forEach((g, i) => tryOne(`More Practice ${key}.${i + 1}`, g));
    for (const grp of Tasks.MISTAKES) grp.list.forEach((m, i) => tryOne(`Common Mistakes ${grp.key}.${i + 1}`, m.gen));
    return n > 1000 && !kinds.length && bad.length <= n / 300 || `${bad.length} of ${n}; kinds: ${kinds.join(', ') || 'none'}; ` + bad.slice(0, 4).join('; ');
  });
  document.getElementById('svg').style.width = '342px';
  t('on the circumscribed question the angle\u2019s expression is beside Q and the arc\u2019s is inside the circle', () => {
    const task = Tasks.LEVELS.find(l => l.key === '5').algebra[2]; drawn(task.fig, task);
    const ex = Array.from(document.querySelectorAll('#svg .expr-lbl')), ang = ex.find(e => e._ray), arc = ex.find(e => e._arc);
    const P = { x: 120, y: 140 }, R = 80, from = e => Math.hypot(e.getAttribute('x') - P.x, e.getAttribute('y') - 5 - P.y);
    return from(arc) < R && from(ang) > R || `arc ${Math.round(from(arc))}, angle ${Math.round(from(ang))} from the center (radius ${R})`;
  });
  t('a labelled angle is marked with a filled wedge, never an arc (arcs mean congruent)', () => {
    const task = Tasks.LEVELS.find(l => l.key === '3').algebra[1]; drawn(task.fig, task);
    const svg = document.getElementById('svg');
    if (svg.querySelectorAll('.expr-wedge').length !== 2) return 'expected two wedges on Level 3 Algebra Connections 2';
    // Every figure that carries an angle expression: a wedge for each, and no arc drawn as a label mark.
    let n = 0;
    const check = (f, task) => {
      const angles = (f.labels || []).filter(l => l.angle).length;
      if (!angles) return '';
      n++; drawn(f, task);
      const boxed = (f.labels || []).filter(l => l.angle && (f.marks || []).some(m => m.angle && m.right && m.angle[1] === l.angle[1])).length;
      if (svg.querySelectorAll('.given-arc, .expr-arc').length) return 'an arc marks a labelled angle';
      return svg.querySelectorAll('.expr-wedge').length >= angles - boxed ? '' : 'a labelled angle has no wedge';
    };
    for (const Lv of Tasks.LEVELS) for (const task of [].concat(...Object.keys(Lv.parts || {}).map(p => Lv.parts[p].tasks || []), Lv.algebra || [])) { if (task.fig) { const r = check(task.fig, task); if (r) return `${Lv.key}: ${r} (${task.ask})`; } }
    for (const key of Object.keys(Tasks.PRACTICE)) for (const g of Tasks.PRACTICE[key]) for (let i = 0; i < 10; i++) { const task = g(); if (task && task.fig) { const r = check(task.fig, task); if (r) return `More Practice ${key}: ${r} (${task.ask})`; } }
    return n > 60 || 'only ' + n + ' figures with angle expressions were checked';
  });
  t('an expression on an arc highlights the arc, and with both radii drawn its central angle gets a wedge too', () => {
    const task = Tasks.LEVELS.find(l => l.key === '5').algebra[2]; drawn(task.fig, task);
    const svg = document.getElementById('svg');
    return svg.querySelectorAll('.expr-arc-hl').length === 1 && svg.querySelectorAll('.expr-wedge').length === 2 && svg.querySelectorAll('.expr-arc').length === 0;
  });
  t('an expression is never upside down, and is level unless its turn is gentle or it would not fit', () => {
    const turns = [];
    for (const Lv of Tasks.LEVELS) for (const task of Lv.algebra || []) { drawn(task.fig, task); document.querySelectorAll('#svg .expr-lbl').forEach(e => turns.push(e._tilt || 0)); }
    return turns.length > 80 && turns.every(a => Math.abs(a) <= 90) || 'a turn beyond 90: ' + turns.filter(a => Math.abs(a) > 90).join(' ');
  });

  const pass = results.filter(r => r.ok).length;
  window.testSummary = { pass, fail: results.length - pass, failures: results.filter(r => !r.ok) };
  document.getElementById('results').innerHTML =
    `<p><strong>${pass} of ${results.length} passed</strong></p><ul>` +
    results.map(r => `<li style="color:${r.ok ? '#14532d' : '#7f1d1d'}">${r.ok ? '✓' : '✗'} ${r.name}${r.info ? ' — ' + r.info.replace(/</g, '&lt;') : ''}</li>`).join('') + '</ul>';
})();
</script>
