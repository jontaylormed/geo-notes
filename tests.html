<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Geometric Interactive Notes tests</title></head>
<body style="font-family:system-ui,sans-serif;max-width:900px;margin:16px auto;padding:0 16px;">
<h1 style="font-size:1.3rem;">Geometric Interactive Notes engine tests</h1>
<div id="results">Running...</div>
<style>/* Warm creams and browns, soft on the eyes. build.ps1 checks the contrast of every text and border pair. */
:root {
  --cream: #fbf6ec; --card: #fffdf8; --title: #94401c; --heading: #33261c; --paper: #fffcf5;
  --text: #3b2f25; --muted: #5c4a3a; --line: #e6dccb; --card-line: #dccbb0; --border: #8a6d4b; --panel: #f3ead9;
  --accent: #6b3f1d; --accent-bg: #f3e3c8; --primary: #5a3a22; --primary-hover: #4a2f1b;
  --warn-bg: #f7e9cf; --warn: #6b3f12; --warn-b: #b07a3a;
  --ok-bg: #e7ecd5; --ok: #3d4f1e; --ok-b: #6b7d3a;
  --bad-bg: #f6dcd5; --bad: #7a2418; --bad-b: #b0503e;
  --grid: #c9b89c; --figure: #3b2f25; --hl: #94401c; --hl-halo: #f3d9c4; --drawn: #5f6f35; --plane: #efe6d4;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 17px; line-height: 1.55; color: var(--text); background: var(--cream); }
main { max-width: 980px; margin: 0 auto; padding: 10px 14px 24px; }
[hidden] { display: none !important; }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; border-bottom: 3px solid var(--title); padding-bottom: 8px; margin-bottom: 6px; }
h1 { font-size: 1.2rem; margin: 0; color: var(--title); line-height: 1.25; }
.where { margin: 0 0 4px; font-size: 0.9rem; color: var(--muted); min-height: 1.3em; }
.lead { font-size: 1.15rem; font-weight: 700; margin: 6px 0 10px; color: var(--heading); }
.lead-sm { display: block; font-weight: 700; margin: 0 0 6px; color: var(--heading); }
.muted { color: var(--muted); margin: 4px 0; }

button { font: inherit; min-height: 44px; padding: 8px 14px; border: 2px solid var(--accent); border-radius: 8px; background: var(--card); color: var(--accent); font-weight: 600; cursor: pointer; }
button:hover { background: var(--accent-bg); }
button.primary, .primary-big { background: var(--primary); border-color: var(--primary); color: var(--paper); }
button.primary:hover, .primary-big:hover { background: var(--primary-hover); }
button:focus-visible, input:focus-visible, summary:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.menu { min-height: 40px; padding: 4px 14px; flex: none; }
.big { display: block; width: 100%; text-align: left; font-size: 1.08rem; padding: 12px 16px; margin: 8px 0; }
.level { padding: 4px 0 12px; border-bottom: 1px solid var(--line); margin-bottom: 8px; }
.level:last-child { border-bottom: none; }
.modes { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 8px; }
.modes .big { flex: 1 1 120px; width: auto; margin: 0; text-align: center; }
.parts { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.part { flex: 1 1 64px; min-height: 40px; padding: 4px 6px; font-size: 0.95rem; font-weight: 600; border-width: 1px; }
.tools .toggle { margin-left: auto; }
.tools .toggle[aria-pressed="true"] { background: var(--accent-bg); color: var(--text); }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choices button { flex: 1 1 140px; }
.choices button.right { background: var(--ok-bg); color: var(--ok); border-color: var(--ok-b); }
.choices button.wrong { background: var(--panel); border-color: var(--card-line); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; }

/* Two areas: the diagram for doing, the labeling area for writing. Side by side when there's room. */
.split { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.card { background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 10px 12px; min-width: 0; }
.diagram-card { flex: 3 1 420px; }
.side { flex: 2 1 260px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }

/* Measurements and congruence, live from the diagram. */
.lengths { list-style: none; padding: 0; margin: 0 0 10px; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 1.05rem; }
.lengths li { white-space: nowrap; }
.congruent { list-style: none; padding: 0; margin: 0; line-height: 2.2; }
.card-title { margin: 0 0 6px; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

.tools { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 8px; }
.tools button { min-height: 44px; padding: 6px 12px; }
.tools button[aria-pressed="true"] { background: var(--primary); border-color: var(--primary); color: var(--paper); }
.hint { margin: 6px 0 0; font-size: 0.88rem; color: var(--muted); }

svg#svg { display: block; width: 100%; height: auto; background: var(--paper); border: 1px solid var(--card-line); border-radius: 8px; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.grid circle { fill: var(--grid); }
.plane polygon { fill: var(--plane); stroke: var(--border); stroke-width: 2; stroke-linejoin: round; }
.plane.hl polygon { fill: var(--hl-halo); stroke: var(--hl); stroke-width: 3.5; }
.line-lbl { font-size: 21px; font-weight: 700; font-style: italic; font-family: Georgia, "Times New Roman", serif; fill: var(--heading); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; }
.plane-lbl { font-size: 19px; font-weight: 700; font-style: italic; fill: var(--heading); }
.obj .stroke { stroke: var(--figure); stroke-width: 3; fill: none; stroke-linecap: round; }
.obj .stroke.behind { stroke-dasharray: 7 6; }
.ticks line { stroke: var(--hl); stroke-width: 2.5; stroke-linecap: round; }
.angle-marks .arc, .angle-marks .right-box { fill: none; stroke: var(--hl); stroke-width: 2.5; }
.angle-hl { fill: var(--hl-halo); stroke: var(--hl); stroke-width: 1.5; }
.given-mark { fill: none; stroke: var(--hl); stroke-width: 2.5; stroke-linecap: round; }
/* An expression in a crowded spot is written a size smaller, so it fits beside its own angle. */
.expr-lbl.snug { font-size: 12px; stroke-width: 4px; }
.expr-lbl { font-size: 14px; font-weight: 700; fill: var(--accent); paint-order: stroke; stroke: var(--paper); stroke-width: 5px; stroke-linejoin: round; }
.tick-note { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.arrowhead { fill: var(--figure); }
.arrowhead-hl { fill: var(--hl); }
.arrowhead-drawn { fill: var(--drawn); }
.obj.hl .stroke { stroke: var(--hl); stroke-width: 4.5; }
.obj.hl .halo { stroke: var(--hl-halo); stroke-width: 14; fill: none; stroke-linecap: round; }
.obj.drawn .stroke { stroke: var(--drawn); stroke-width: 3.5; stroke-dasharray: 10 5; }
.obj.picked .stroke { stroke: var(--hl); stroke-width: 4.5; stroke-dasharray: 8 4; }
.obj .hit { stroke: transparent; stroke-width: 24; fill: none; cursor: pointer; pointer-events: stroke; }
/* The tap area sits under the drawn line; the line itself lets taps through to it. Keyboard focus
   shows as a band in --border, 4.6:1 on the diagram (checked in build-geo as border/white). */
.obj path:not(.hit), .obj text { pointer-events: none; }
.obj .hit:focus-visible { stroke: var(--border); stroke-width: 14; outline: none; }
.pt .hit { fill: transparent; }
.pt .dot { fill: var(--figure); stroke: var(--paper); stroke-width: 1.5; }
.pt .lbl { font-size: 17px; font-weight: 700; fill: var(--heading); paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
.pt { outline: none; }
.pt.movable { cursor: grab; touch-action: none; }
.pt.movable .dot { fill: var(--accent); r: 7; }
.pt.dragging { cursor: grabbing; }
.pt.first .dot { fill: var(--hl); r: 8; }
.pt:focus-visible .hit { stroke: var(--accent); stroke-width: 3; fill: var(--accent-bg); fill-opacity: 0.5; }
svg[data-tool="segment"] .pt, svg[data-tool="ray"] .pt, svg[data-tool="line"] .pt { cursor: pointer; }

/* Notation: a bar over a segment, a bar with one arrowhead over a ray, two over a line.
   The bar spans the letters exactly and everything is sized in em, so it scales with the text.
   The mark sits in a thin band above the letters instead of taking a line of its own. */
.nt { display: inline-block; position: relative; padding-top: 0.34em; line-height: 1.15; }
.nt-pts { font-weight: 700; letter-spacing: 0.03em; }
/* The mark: one SVG centered over the letters, in a thin band above them. */
.nt-svg { position: absolute; top: 0.02em; left: 50%; transform: translateX(-50%); height: 0.3em; overflow: visible; }
.chip { display: inline-block; padding: 2px 8px; margin: 2px 0; background: var(--panel); border: 1px solid var(--card-line); border-radius: 6px; white-space: nowrap; }
.names { line-height: 2.2; margin: 0 0 6px; }
.and { color: var(--muted); padding: 0 4px; }

.entry-row { display: flex; gap: 8px; align-items: center; }
.entry-row input { flex: 1 1 auto; min-width: 0; }
input[type=text] { font: inherit; font-size: 1.15rem; min-height: 48px; padding: 6px 10px; border: 2px solid var(--border); border-radius: 8px; width: 100%; color: var(--text); background: var(--paper); }
.keypad { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }
.keypad button { flex: 1 1 80px; }
.steps { margin: 0 0 6px; padding-left: 22px; }
.steps li { margin: 0 0 10px; }
.done-line { margin: 2px 0 0; font-weight: 700; color: var(--ok); font-size: 1.1rem; }
.hint-box { margin: 8px 0; }
.hint-box summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 40px; display: list-item; padding: 8px 0; }
.written { margin: 0 0 8px; color: var(--muted); }
.as-typed { display: inline-block; margin-left: 4px; padding: 2px 10px; font-size: 1.15rem; color: var(--bad); background: var(--bad-bg); border: 1px dashed var(--bad-b); border-radius: 6px; }
.nt-letter { font-weight: 700; font-family: Georgia, "Times New Roman", serif; }
/* The output box: what was typed, shown in true notation, centered. */
.preview { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 3.1em; margin: 8px 0; padding: 6px 12px;
  font-size: 1.4rem; background: var(--paper); border: 2px solid var(--card-line); border-radius: 8px; }

.claims { list-style: none; padding: 0; margin: 0; }
.claims li { margin: 6px 0; }
.claim { display: block; width: 100%; text-align: left; font-weight: 400; color: var(--text); border: 2px solid var(--card-line); line-height: 1.9; }
.claim.found { border-color: var(--ok-b); background: var(--ok-bg); }
.claim.okline { border-color: var(--card-line); background: var(--panel); }

.feedback { padding: 8px 12px; border-radius: 8px; margin: 8px 0; }
.feedback:empty { display: none; }
.feedback button { min-height: 36px; padding: 2px 10px; margin-left: 4px; }
.good { background: var(--ok-bg); color: var(--ok); border: 1px solid var(--ok-b); }
.bad { background: var(--bad-bg); color: var(--bad); border: 1px solid var(--bad-b); }
.almost { background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn-b); }

.facts { margin: 12px 0 0; background: var(--card); border: 1px solid var(--card-line); border-radius: 10px; padding: 6px 12px; }
.facts summary { cursor: pointer; font-weight: 700; color: var(--accent); min-height: 40px; display: list-item; padding: 8px 0; }
.facts table { border-collapse: collapse; margin: 6px 12px 10px 0; display: inline-table; vertical-align: top; }
.facts caption { text-align: left; font-weight: 700; padding: 2px 0; }
.facts th, .facts td { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.facts th { background: var(--panel); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

@media (max-width: 480px) {
  main { padding: 8px 8px 16px; }
  h1 { font-size: 1.05rem; }
  .card { padding: 8px; }
  .diagram-card, .side { flex-basis: 100%; }
}

/* More Practice: one button per level, two across when there's room. */
.practice-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
.practice-list .big { flex: 0 1 calc(50% - 4px); width: auto; margin: 0; text-align: center; }
@media (max-width: 560px) { .practice-list .big { flex-basis: 100%; } }
.lengths .tri-kind { flex-basis: 100%; font-weight: 600; }

/* Circles: the circle itself like any figure; the arc a task is about, thick in the highlight color. */
.circ { fill: none; stroke: var(--figure); stroke-width: 2.5; }
.arc-hl { fill: none; stroke: var(--hl); stroke-width: 7; stroke-linecap: round; opacity: 0.85; }
/* The mark that ties an expression to the angle it measures: a pale wedge at the vertex, in the expression's color. A filled shape, never an arc: arcs mean congruent angles. */
.expr-wedge { fill: var(--accent); fill-opacity: 0.32; stroke: none; }
.expr-arc-hl { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; opacity: 0.8; }

/* Complete the Proof: a two-column proof, statements left, reasons right. */
.proof { width: 100%; border-collapse: collapse; margin: 0 0 8px; font-size: 0.95rem; }
.proof th, .proof td { border: 1px solid var(--card-line); padding: 6px 8px; text-align: left; vertical-align: top; }
.proof th { background: var(--panel); color: var(--heading); }
.proof select { font: inherit; width: 100%; max-width: 100%; min-height: 40px; border: 2px solid var(--accent); border-radius: 6px; background: var(--card); color: var(--text); }
.pf-mark { font-weight: 700; margin-left: 4px; }
.pf-mark.ok { color: var(--ok); }
.pf-mark.no { color: var(--bad); }
/* Bridges on the home menu sit a little apart from the levels. */
.level.bridge { background: var(--panel); border-radius: 10px; padding: 8px 12px 12px; }

/* Show or hide measurements and congruent marks. "On" shows a check mark, so the state is not shown by color alone. */
.view-toggles { display: flex; flex-wrap: wrap; gap: 8px; }
.view-toggles .toggle { flex: 1 1 130px; min-height: 40px; padding: 4px 10px; font-size: 0.95rem; }
.view-toggles .toggle[aria-pressed="true"] { background: var(--accent-bg); color: var(--text); }
.view-toggles .toggle[aria-pressed="true"]::before { content: "\2713\00a0"; }
.view-toggles .toggle[aria-pressed="false"] { color: var(--muted); border-style: dashed; }

/* The question: a highlighted callout above the diagram, repeated at the top of the labeling area. */
.ask-box { background: var(--accent-bg); border-left: 5px solid var(--title); border-radius: 8px; padding: 8px 12px; margin: 4px 0 12px; }
.ask-box .lead { margin: 0; }
.ask-kind { margin: 0 0 2px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--title); }
.ask-copy .ask-text { margin: 0; font-weight: 700; color: var(--heading); font-size: 1.02rem; }

/* Checkpoint between levels: a red rule across the top, like a new chapter, and the new
   level's themes listed, the first in bold. */
.cp-card { max-width: 560px; margin: 8px auto; padding: 16px 18px; border-top: 6px solid var(--title); }
.cp-done { margin: 0 0 12px; font-weight: 700; color: var(--accent); }
.cp-card .lead { margin: 0 0 6px; color: var(--title); font-size: 1.35rem; }
.cp-card .lead:focus { outline: none; }
.cp-note { margin: 0 0 10px; color: var(--text); font-weight: 700; background: var(--accent-bg); border-radius: 6px; padding: 6px 10px; }
.cp-themes { margin: 0 0 8px; padding-left: 1.4em; }
.cp-themes li { margin: 3px 0; color: var(--text); }
.cp-themes li.next { font-weight: 700; color: var(--heading); }
</style>
<svg id="svg" style="display:block;width:342px;max-width:none;" aria-hidden="true"></svg>
<script>/* Geometry engine for Geometric Interactive Notes. No DOM here, so every rule can be tested.
   Model: a 20 x 14 grid, y pointing up. A point has coordinates, or sits on the line through two
   other points at parameter t (so it stays exactly on that line when they move).
   A figure object is { kind: 'segment' | 'ray' | 'line', a, b } where a and b are point names;
   for a ray, a is the endpoint. */
const Geom = (() => {
  'use strict';
  const W = 20, H = 14;
  const EPS = 1e-9;
  const sub = (a, b) => ({ x: a.x - b.x, y: a.y - b.y });
  const cross = (u, v) => u.x * v.y - u.y * v.x;
  const dot = (u, v) => u.x * v.x + u.y * v.y;
  const len = u => Math.hypot(u.x, u.y);

  const KINDS = {
    segment: { word: 'segment', ends: 'has two endpoints' },
    ray: { word: 'ray', ends: 'has one endpoint and goes on forever in one direction' },
    line: { word: 'line', ends: 'has no endpoints and goes on forever in both directions' },
    plane: { word: 'plane', ends: 'is a flat surface that goes on forever in every direction' },
  };

  // ---------- Positions ----------
  function pos(fig, name, depth = 0) {
    const p = fig.points[name];
    if (!p) throw new Error('There is no point ' + name + '.');
    if (depth > 6) throw new Error('Point ' + name + ' depends on itself.');
    // On a circle, at an angle (degrees) from its center.
    if (p.circ) {
      const C = pos(fig, p.circ, depth + 1), r = radius(fig, p.circ), a = p.deg * Math.PI / 180;
      return { x: C.x + r * Math.cos(a), y: C.y + r * Math.sin(a) };
    }
    // Where a tangent from point `from` touches the circle (side 1 or -1 picks which of the two).
    // Not a number when `from` is inside the circle, so moves that put it there are refused.
    if (p.tanFrom) {
      const C = pos(fig, p.circ2, depth + 1), Q = pos(fig, p.tanFrom, depth + 1), r = radius(fig, p.circ2);
      const d = Math.hypot(Q.x - C.x, Q.y - C.y), base = Math.atan2(Q.y - C.y, Q.x - C.x), a = base + p.side * Math.acos(r / d);
      return d > r + 1e-9 ? { x: C.x + r * Math.cos(a), y: C.y + r * Math.sin(a) } : { x: NaN, y: NaN };
    }
    // On the tangent line at point `at`, a distance d along it.
    if (p.tanLine) {
      const T = pos(fig, p.tanLine, depth + 1), C = pos(fig, p.circ2, depth + 1), l = Math.hypot(T.x - C.x, T.y - C.y);
      return { x: T.x - p.d * (T.y - C.y) / l, y: T.y + p.d * (T.x - C.x) / l };
    }
    if (!p.on) return { x: p.x, y: p.y };
    const A = pos(fig, p.on[0], depth + 1), B = pos(fig, p.on[1], depth + 1);
    return { x: A.x + p.t * (B.x - A.x), y: A.y + p.t * (B.y - A.y) };
  }
  const samePos = (P, Q) => Math.abs(P.x - Q.x) < 1e-7 && Math.abs(P.y - Q.y) < 1e-7;
  function collinear(P, Q, R) {
    const u = sub(Q, P), v = sub(R, P);
    return Math.abs(cross(u, v)) <= EPS * Math.max(1, len(u) * len(v));
  }
  // Where X sits along A -> B: 0 at A, 1 at B. Only meaningful when X is on line AB.
  function param(A, B, X) { const d = sub(B, A); return dot(sub(X, A), d) / dot(d, d); }

  // ---------- Which figure does a name describe? ----------
  // Two names describe the same figure when they are the same set of points, whatever the drawing order.
  function same(fig, f, g) {
    if (f.kind !== g.kind) return false;
    const A = pos(fig, f.a), B = pos(fig, f.b), C = pos(fig, g.a), D = pos(fig, g.b);
    if (f.kind === 'segment') return (samePos(A, C) && samePos(B, D)) || (samePos(A, D) && samePos(B, C));
    if (f.kind === 'line') return collinear(A, B, C) && collinear(A, B, D);
    return samePos(A, C) && collinear(A, B, D) && param(A, B, D) > EPS;   // ray: same endpoint, same direction
  }
  // Is point X on figure f?
  function onFigure(fig, f, x) {
    const A = pos(fig, f.a), B = pos(fig, f.b), X = pos(fig, x);
    if (!collinear(A, B, X)) return false;
    const t = param(A, B, X);
    if (f.kind === 'segment') return t >= -EPS && t <= 1 + EPS;
    if (f.kind === 'ray') return t >= -EPS;
    return true;
  }
  // Every correct name for f using the points in the figure (segment names use its endpoints only).
  function names(fig, f) {
    if (f.kind === 'segment') return [[f.a, f.b], [f.b, f.a]];
    const pts = Object.keys(fig.points), out = [];
    for (const p of pts) for (const q of pts) if (p !== q && same(fig, f, { kind: f.kind, a: p, b: q })) out.push([p, q]);
    return out;
  }
  // Rays VA and VB are opposite when they share endpoint V and point exactly opposite ways.
  function opposite(fig, v, a, b) {
    const V = pos(fig, v), A = pos(fig, a), B = pos(fig, b);
    return collinear(A, V, B) && param(V, A, B) < -EPS;
  }
  // Is point m strictly between a and b on one line?
  function between(fig, a, m, b) {
    const A = pos(fig, a), M = pos(fig, m), B = pos(fig, b);
    if (!collinear(A, B, M)) return false;
    const t = param(A, B, M);
    return t > EPS && t < 1 - EPS;
  }
  const collinearPts = (fig, a, b, c) => collinear(pos(fig, a), pos(fig, b), pos(fig, c));

  // ---------- Moving points ----------
  const inBounds = P => P.x >= 1 - 1e-9 && P.x <= W - 1 + 1e-9 && P.y >= 1 - 1e-9 && P.y <= H - 1 + 1e-9;
  const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
  // The two points that make an equilateral triangle with A and B.
  function apexes(A, B) {
    const d = sub(B, A), h = Math.sqrt(3) / 2, mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
    return [{ x: mid.x - d.y * h, y: mid.y + d.x * h }, { x: mid.x + d.y * h, y: mid.y - d.x * h }];
  }
  // Where a dragged point lands. Free points snap to the grid, or onto a "magnet" line when the
  // pointer is close, so a point can land exactly on a line. Points built on a line slide along it
  // in steps of about one unit. Returns null when the move isn't allowed (off the grid, or on top
  // of another point). A magnet with `for` pulls only that point.
  function snapMove(fig, name, M, magnets = []) {
    magnets = magnets.filter(mg => !mg.for || mg.for === name);
    const p = fig.points[name];
    let next;
    if (p.tanFrom || p.tanLine) return null;       // built from other points; it moves with them

  // ---------- Planes ----------
  // A flat diagram can't show depth, so which points lie in a plane is part of how the figure is

  const plane = (fig, label) => (fig.planes || []).find(p => p.label === label);

  function insideQuad(quad, P) {

  // ---------- Angles ----------

  // ---------- Triangles ----------

  // ---------- Circles ----------
  // fig.circles = [{ c: 'P', r }]: a circle is named by its center (⊙P).

<script>/* Reading and showing figure names. Loose typing is accepted ("seg AB", "ray BA", "line AB"); the
   answer is judged against the figure. Capital and lowercase letters are part of the notation, so
   the reader keeps the case exactly as typed and the checker teaches it:
     points and planes use capitals (A, plane N); a line's one-letter name is lowercase (line m).
   No DOM here. */
const Notation = (() => {
  'use strict';
  const WORDS = { 'line segment': 'segment', segment: 'segment', seg: 'segment', ray: 'ray', line: 'line', plane: 'plane' };

  // Results:
  //   "segment AB"  -> { kind: 'segment', pts: ['A', 'B'], raw: ['A', 'B'] }
  //   "line m"      -> { kind: 'line', letter: 'm' }            (a line's own one-letter name)
  //   "plane N"     -> { kind: 'plane', pts: ['N'], raw: ['N'] }
  //   "AB"          -> { kind: null, pts: ['A', 'B'] }         (no mark: a length, so the checker asks)
  // pts are always capitals, for looking points up; raw keeps what was typed, for teaching case.
  // Angles: "angle ABC", "<ABC", "∠ABC"; a measure adds m: "m<ABC = 75", "m∠ABC=75°",
  // "measure of angle ABC = 75 degrees".
  //   -> { kind: 'angle', pts: ['A', 'B', 'C'], raw, measure: true, value: 75 }
  const ANGLE = /^(?:(m|measure of)\s*)?(?:∠|<|angle\b)\s*([A-Za-z]+)\s*(?:=\s*(-?\d+(?:\.\d+)?)\s*(?:°|degrees?|deg)?)?$/i;
  function parseAngle(s) {
    const m = s.replace(/\s+/g, ' ').trim().match(ANGLE);
    if (!m) return null;
    const raw = m[2].split(''), pts = m[2].toUpperCase().split('');
    if (pts.length !== 1 && pts.length !== 3) return { kind: 'angle', error: 'Name an angle with three points, vertex in the middle, like angle ABC.' };
    if (new Set(pts).size !== pts.length) return { kind: 'angle', error: 'Use three different points.' };
    return { kind: 'angle', pts, raw, lowercase: raw.some(c => c !== c.toUpperCase()), measure: !!m[1], value: m[3] != null ? Number(m[3]) : null };
  }

  // A relationship between two lines: "line m ∥ line n", "m || n", "AB ⊥ EF",
  // "m is perpendicular to t".  -> { kind: 'relation', rel: 'parallel' | 'perpendicular', left, right }
  // where each side is a line name: { letter } or { pts, raw, lowercase }.
  function parseRelation(s) {
    const t = s.replace(/\s+/g, ' ').trim()
      .replace(/\s*(∥|\|\||\/\/|\bis parallel to\b|\bparallel to\b|\bparallel\b)\s*/i, ' PAR ')
      .replace(/\s*(⊥|_\|_|\bis perpendicular to\b|\bperpendicular to\b|\bperpendicular\b|\bperp\b)\s*/i, ' PERP ');
    const m = t.match(/^(.*) (PAR|PERP) (.*)$/);
    if (!m) return null;
    const side = x => {
      const letters = x.replace(/^\s*line\b/i, '').replace(/[^A-Za-z]/g, '');
      if (letters.length === 1) return { letter: letters };
      if (letters.length === 2) return { pts: letters.toUpperCase().split(''), raw: letters.split(''), lowercase: letters !== letters.toUpperCase() };
      return null;
    };
    const left = side(m[1]), right = side(m[3]);
    if (!left || !right) return { kind: 'relation', error: 'Write two lines with a sign between them, like m ∥ n.' };
    return { kind: 'relation', rel: m[2] === 'PAR' ? 'parallel' : 'perpendicular', left, right };
  }

  // A triangle: "△ABC", "triangle ABC", "tri ABC".  -> { kind: 'triangle', pts, raw, lowercase }
  const TRI = /^(?:△|∆|triangle\b|tri\b)\s*([A-Za-z\s]+)$/i;
  function parseTriangle(s) {
    const m = s.replace(/\s+/g, ' ').trim().match(TRI);
    if (!m) return null;
    const letters = m[1].replace(/\s+/g, ''), raw = letters.split(''), pts = letters.toUpperCase().split('');
    if (pts.length !== 3) return { kind: 'triangle', error: 'Name a triangle with its three vertices, like △ABC.' };
    if (new Set(pts).size !== 3) return { kind: 'triangle', error: 'Use three different points.' };
    return { kind: 'triangle', pts, raw, lowercase: raw.some(c => c !== c.toUpperCase()) };
  }

  // A statement about two triangles: "△ABC ≅ △DEF", "tri ABC ~= tri DEF", "△ABC ∼ △DEF",
  // "triangle ABC is similar to triangle DEF". The vertex order is part of the statement.
  //   -> { kind: 'triRel', rel: 'congruent' | 'similar', left, right, lowercase, noSign }
  const REL_WORDS = /\s*(≅|~=|≃|\bis congruent to\b|\bcongruent to\b|\bcong\b|∼|~|\bis similar to\b|\bsimilar to\b|\bsim\b)\s*/i;
  function parseTriRel(s) {
    const m = s.replace(/\s+/g, ' ').trim().split(REL_WORDS);
    if (m.length !== 3) return null;
    const side = x => {
      const sign = /^(△|∆|triangle\b|tri\b)/i.test(x.trim());
      const letters = x.replace(/^\s*(△|∆|triangle\b|tri\b)/i, '').replace(/\s+/g, '');
      return /^[A-Za-z]{3}$/.test(letters) ? { pts: letters.toUpperCase().split(''), raw: letters.split(''), sign } : null;
    };
    const left = side(m[0]), right = side(m[2]);
    if (!left || !right) return /^[A-Za-z△∆\s]+$/.test(m[0] + m[2]) ? { kind: 'triRel', error: 'Name each triangle with △ and three vertices, like △ABC ≅ △DEF.' } : null;
    const rel = /≅|~=|≃|cong/i.test(m[1]) ? 'congruent' : 'similar';
    const lowercase = left.raw.concat(right.raw).some(c => c !== c.toUpperCase());
    return { kind: 'triRel', rel, left, right, lowercase, noSign: !left.sign || !right.sign };
  }

  // A circle is named by its center: "⊙P", "circle P".  -> { kind: 'circle', pts: ['P'], raw, lowercase }
  // An arc: "⌒AB", "arc AB", "arc ACB"; its measure adds m: "m arc AB = 70", "m⌒AB = 70°".
  //   -> { kind: 'arc', pts, raw, lowercase, measure, value }
  const CIRCLE = /^(?:⊙|circle\b)\s*([A-Za-z])$/i;
  const ARC = /^(?:(m|measure of)\s*)?(?:⌒|arc\b)\s*([A-Za-z\s]+?)\s*(?:=\s*(-?\d+(?:\.\d+)?)\s*(?:°|degrees?|deg)?)?$/i;
  function parseCircleArc(s) {
    const t = s.replace(/\s+/g, ' ').trim();
    const c = t.match(CIRCLE);
    if (c) return { kind: 'circle', pts: [c[1].toUpperCase()], raw: [c[1]], lowercase: c[1] !== c[1].toUpperCase() };
    const m = t.match(ARC);
    if (!m) return null;
    const letters = m[2].replace(/\s+/g, ''), raw = letters.split(''), pts = letters.toUpperCase().split('');
    if (pts.length !== 2 && pts.length !== 3) return { kind: 'arc', error: 'Name an arc with its two endpoints, like arc AB, or three points for a major arc, like arc ACB.' };
    if (new Set(pts).size !== pts.length) return { kind: 'arc', error: 'Use different points.' };
    return { kind: 'arc', pts, raw, lowercase: raw.some(ch => ch !== ch.toUpperCase()), measure: !!m[1], value: m[3] != null ? Number(m[3]) : null };
  }

  function parse(src) {
    let s = String(src == null ? '' : src).trim();
    if (!s) return { error: 'Type a name first.' };
    const circ = parseCircleArc(s);
    if (circ) return circ;
    const triRel = parseTriRel(s);
    if (triRel) return triRel;
    const tri = parseTriangle(s);
    if (tri) return tri;
    const ang = parseAngle(s);
    if (ang) return ang;
    const relation = parseRelation(s);
    if (relation) return relation;
    s = s.replace(/↔|<->|<>/g, ' line ').replace(/→|->/g, ' ray ').replace(/[^A-Za-z ]+/g, ' ').replace(/\s+/g, ' ').trim();
    let kind = null, rest = s;
    const m = s.match(/^(line segment|segment|seg|ray|line|plane)\b\s*(.*)$/i);
    if (m) { kind = WORDS[m[1].toLowerCase()]; rest = m[2]; }
    const letters = rest.replace(/\s+/g, '');
    const raw = letters.split('');
    const pts = letters.toUpperCase().split('');
    const lowercase = raw.some(c => c !== c.toUpperCase());
    if (kind === 'plane') {
      if (!letters) return { kind, error: 'Add a letter or three points, like plane M or plane ABC.' };
      if (pts.length !== 1 && pts.length !== 3) return { kind, error: 'Name a plane with one letter or three points, like plane M or plane ABC.' };
      if (new Set(pts).size !== pts.length) return { kind, error: 'Use three different points.' };
      return { kind, pts, raw, lowercase };
    }
    if (kind === 'line' && letters.length === 1) return { kind, letter: letters };
    if (!letters) return { kind, error: 'Add two point letters, like ' + (kind || 'segment') + ' AB.' };
    if (pts.length !== 2) return { kind, error: pts.length < 2 ? 'Use two points to name it.' : 'Use exactly two points, like ray AB.' };
    if (pts[0] === pts[1]) return { kind, error: 'Use two different points.' };
    return { kind, pts, raw, lowercase };
  }

  const PREFIX = { angle: '∠', triangle: '△', circle: '⊙', arc: '⌒' };
  const text = (kind, pts) => PREFIX[kind] ? PREFIX[kind] + pts.join('') : (kind ? kind + ' ' : '') + pts.join('');
  const speak = (kind, pts) => (kind ? kind + ' ' : '') + pts.join(' ');
  // m∠ABC = 75°, as text and as words.
  const measureText = (pts, value) => `m∠${pts.join('')} = ${value}°`;
  const measureSpeak = (pts, value) => `the measure of angle ${pts.join(' ')} is ${value} degrees`;
  // True notation: a bar over a segment, a bar with one arrowhead over a ray, two over a line.
  // The mark is drawn in CSS so it spans the letters exactly and scales with them. It is hidden
  // from screen readers, which get the words instead.
  function show(kind, pts) {
    const letters = pts.join('');
    // A plane has no mark over it: "plane M" or "plane ABC". Neither does a line's one-letter name.
    if (kind === 'plane') return `<span aria-hidden="true">plane <span class="nt-pts">${letters}</span></span><span class="sr">${speak(kind, pts)}</span>`;
    if (kind === 'line' && pts.length === 1) return `<span aria-hidden="true">line <em class="nt-letter">${letters}</em></span><span class="sr">line ${letters}</span>`;
    if (kind === 'angle') return `<span aria-hidden="true">∠<span class="nt-pts">${letters}</span></span><span class="sr">${speak(kind, pts)}</span>`;
    if (kind === 'triangle') return `<span aria-hidden="true">△<span class="nt-pts">${letters}</span></span><span class="sr">${speak(kind, pts)}</span>`;
    if (kind === 'circle') return `<span aria-hidden="true">⊙<span class="nt-pts">${letters}</span></span><span class="sr">circle ${letters}</span>`;
    if (kind === 'arc') return `<span aria-hidden="true"><span class="nt">${arcMark(letters.length)}<span class="nt-pts">${letters}</span></span></span><span class="sr">${speak(kind, pts)}</span>`;
    const body = !kind
      ? `<span class="nt-pts">${letters}</span>`
      : `<span class="nt">${mark(kind, letters.length)}<span class="nt-pts">${letters}</span></span>`;
    return `<span aria-hidden="true">${body}</span><span class="sr">${speak(kind, pts)}</span>`;
  }
  // The bar and arrowheads are one small SVG in one coordinate system, so the heads always sit
  // exactly on the bar at any size (separate CSS pieces round to pixels apart). Its width is set in
  // em from the letter count, and its viewBox has the same proportions, so the heads never stretch.
  function mark(kind, n) {
    const W = n * 68, mid = 15, head = 17;
    const x1 = kind === 'line' ? head - 2 : 2, x2 = kind === 'segment' ? W - 2 : W - head + 2;
    let d = `<path d="M${x1},${mid} L${x2},${mid}" stroke="currentColor" stroke-width="7" stroke-linecap="butt" fill="none"></path>`;
    if (kind !== 'segment') d += `<path d="M${W - head},${mid - 11} L${W},${mid} L${W - head},${mid + 11} Z" fill="currentColor"></path>`;
    if (kind === 'line') d += `<path d="M${head},${mid - 11} L0,${mid} L${head},${mid + 11} Z" fill="currentColor"></path>`;
    return `<svg class="nt-svg" viewBox="0 0 ${W} 30" style="width:${n * 0.68}em" focusable="false">${d}</svg>`;

  function arcMark(n) {
    const W = n * 68;
    return `<svg class="nt-svg" viewBox="0 0 ${W} 30" style="width:${n * 0.68}em" focusable="false"><path d="M4,26 Q${W / 2},-8 ${W - 4},26" stroke="currentColor" stroke-width="6" fill="none" stroke-linecap="round"></path></svg>`;
  }

  const arcMeasureText = (pts, value) => `m⌒${pts.join('')} = ${value}°`;

  // △ABC ≅ △DEF, as text and as HTML (with words for screen readers).
  const triRelText = (rel, t, u) => `△${t.join('')} ${rel === 'congruent' ? '≅' : '∼'} △${u.join('')}`;
  const triRelShow = (rel, t, u) => `${show('triangle', t)} <span aria-hidden="true">${rel === 'congruent' ? '≅' : '∼'}</span><span class="sr">is ${rel} to</span> ${show('triangle', u)}`;

  return { parse, text, speak, show, measureText, measureSpeak, triRelText, triRelShow, arcMeasureText };
})();

<script>/* Algebra on the diagram: expressions like 2x + 10 on segments and angles, and the equations that
   come from a figure's relationships. No DOM here.
   Students work in three steps: write an equation, solve for x, find the measure. An equation is
   accepted in any arrangement, because what matters is that left minus right is a multiple of the
   relationship's own equation. Loose typing is fine: 2x, 2(x+1), x2 and "3 x" all read as products. */
const Algebra = (() => {
  'use strict';

  // ---------- Reading expressions ----------
  function tokenize(src) {
    const s = String(src).replace(/[−–—]/g, '-').replace(/[×⋅·]/g, '*').replace(/÷/g, '/').replace(/°/g, '');
    const out = [];
    for (let i = 0; i < s.length;) {
      const c = s[i];
      if (/\s/.test(c)) { i++; continue; }
      const num = s.slice(i).match(/^\d+(\.\d+)?|^\.\d+/);
      if (num) { out.push({ k: 'num', v: Number(num[0]) }); i += num[0].length; continue; }
      if (/[xX]/.test(c)) { out.push({ k: 'x' }); i++; continue; }
      if ('+-*/^()'.includes(c)) { out.push({ k: c }); i++; continue; }
      throw new Error(`I can't read "${c}" here.`);
    }
    return out;
  }
  // Recursive descent with implicit multiplication. The result is a function of x.
  function parse(src) {
    const t = tokenize(src);
    if (!t.length) throw new Error('Type an expression.');
    let i = 0;
    const peek = () => t[i], take = () => t[i++];
    const startsFactor = tk => tk && (tk.k === 'num' || tk.k === 'x' || tk.k === '(');
    function expr() {
      let f = term();
      while (peek() && (peek().k === '+' || peek().k === '-')) {
        const op = take().k, g = term(), a = f;
        f = op === '+' ? x => a(x) + g(x) : x => a(x) - g(x);
      }
      return f;
    }
    function term() {
      let f = unary();
      for (;;) {
        const tk = peek();
        if (tk && (tk.k === '*' || tk.k === '/')) {
          take();
          const g = unary(), a = f;
          f = tk.k === '*' ? x => a(x) * g(x) : x => a(x) / g(x);
        } else if (startsFactor(tk)) {
          const g = power(), a = f;           // 2x, 2(x+1), x(x-1), x2
          f = x => a(x) * g(x);
        } else return f;
      }
    }
    function unary() {
      if (peek() && peek().k === '-') { take(); const g = unary(); return x => -g(x); }
      if (peek() && peek().k === '+') { take(); return unary(); }
      return power();
    }
    function power() {
      const b = atom();
      if (peek() && peek().k === '^') { take(); const e = unary(); return x => Math.pow(b(x), e(x)); }
      return b;
    }
    function atom() {
      const tk = take();
      if (!tk) throw new Error('Something is missing at the end.');
      if (tk.k === 'num') { const v = tk.v; return () => v; }
      if (tk.k === 'x') return x => x;
      if (tk.k === '(') {
        const f = expr();
        if (!peek() || peek().k !== ')') throw new Error('A "(" needs a ")".');
        take();
        return f;
      }
      throw new Error(`"${tk.k}" needs a number or x before it.`);
    }
    const f = expr();
    if (i < t.length) throw new Error(t[i].k === ')' ? 'There is a ")" without a "(".' : "I can't read the end of that.");
    return f;
  }
  // a*x + b, found by evaluating; null when the expression isn't linear in x.
  function linear(f) {
    const b = f(0), a = f(1) - b;
    const ok = [2, -3, 0.5].every(x => Math.abs(f(x) - (a * x + b)) < 1e-9 * Math.max(1, Math.abs(f(x))));
    return ok && isFinite(a) && isFinite(b) ? { a, b } : null;
  }

  // ---------- Equations ----------
  // "2x + 10 = 3x - 20" -> the linear form of (left - right).
  function equation(src) {
    const parts = String(src).split('=');
    if (parts.length !== 2) return { error: parts.length < 2 ? 'Write an equation: it needs an = sign.' : 'Use one = sign.' };
    if (/[a-wyzA-WYZ]/.test(src)) return { error: 'Use the expressions on the diagram, with x.' };
    let L, R;
    try { L = parse(parts[0]); R = parse(parts[1]); } catch (e) { return { error: e.message }; }
    const d = linear(x => L(x) - R(x));
    if (!d) return { error: 'That equation isn’t in the form this problem gives.' };
    return { form: d, left: L, right: R };
  }
  // Same equation up to rearranging: both forms describe the same line a*x + b = 0.
  const sameForm = (p, q) => Math.abs(p.a * q.b - q.a * p.b) < 1e-9 * Math.max(1, Math.abs(p.a * q.b)) && Math.abs(p.a) + Math.abs(p.b) > 1e-12 && (Math.abs(p.a) > 1e-12) === (Math.abs(q.a) > 1e-12);
  const root = f => -f.b / f.a;

  // The relationship's own equation, as a linear form, from the expressions on the figure.
  //   rel = { is: 'equal', a, b }               a = b         (vertical, corresponding, midpoint)
  //   rel = { is: 'sum', parts: [a, b], total }  a + b = total (segment addition, linear pair = 180)
  function relForm(rel) {
    const f = rel.is === 'equal'
      ? (() => { const A = parse(rel.a), B = parse(rel.b); return x => A(x) - B(x); })()
      : (() => { const ps = rel.parts.map(parse), T = parse(String(rel.total)); return x => ps.reduce((s, p) => s + p(x), 0) - T(x); })();
    return linear(f);
  }

  // Step 1: the equation. Wrong relationships get named.
  function checkSetup(problem, input) {
    const eq = equation(input);
    if (eq.error) return { status: 'bad', message: eq.error };
    const want = relForm(problem.rel);
    if (sameForm(eq.form, want)) return { status: 'good', x: root(want) };
    for (const alt of problem.wrong || []) {
      if (sameForm(eq.form, relForm(alt.rel))) return { status: 'bad', message: alt.why };
    }
    return { status: 'bad', message: problem.hint };
  }
  // Step 2: x. Accepts "x = 30", "30 = x" or "30".
  function checkSolve(problem, input) {
    const want = root(relForm(problem.rel));
    const m = String(input).replace(/\s+/g, '').match(/^(?:x=)?(-?\d+(?:\.\d+)?)(?:=x)?$/i);
    if (!m) return { status: 'ask', message: 'Write it as x = a number.' };
    if (Math.abs(Number(m[1]) - want) > 1e-9) return { status: 'bad', message: `Check by putting x = ${m[1]} back into your equation: the two sides aren't equal.` };
    return { status: 'good', x: want };
  }
  // Step 3: the measure. Accepts "AB = 11", "m∠ABC = 70°", or just the number.
  function checkFind(problem, input) {
    const x = root(relForm(problem.rel)), want = parse(problem.find.expr)(x);
    const nums = String(input).replace(/−/g, '-').match(/-?\d+(\.\d+)?/g);
    if (!nums) return { status: 'ask', message: `Put x = ${fmt(x)} into ${problem.find.expr}.` };
    const v = Number(nums[nums.length - 1]);
    if (Math.abs(v - want) > 1e-9) return { status: 'bad', message: `Put x = ${fmt(x)} into ${problem.find.expr} and find the value again.` };
    if (problem.find.angle && !/m\s*(∠|<|angle)/i.test(input) && /∠|<|angle/i.test(input)) {
      return { status: 'almost', message: `Almost. The measure is written with m: m∠${problem.find.name} = ${fmt(want)}°.` };
    }
    if (problem.find.arc && !/m\s*(⌒|arc)/i.test(input) && /⌒|arc/i.test(input)) {
      return { status: 'almost', message: `Almost. An arc's measure is written with m: m⌒${problem.find.name} = ${fmt(want)}°.` };
    }
    return { status: 'good', value: want };
  }
  const fmt = v => (Math.abs(v - Math.round(v)) < 1e-9 ? String(Math.round(v)) : v.toFixed(2));

  return { parse, linear, equation, relForm, sameForm, root, checkSetup, checkSolve, checkFind, fmt };
})();

  // ---------- Level 5: circles ----------
  // A circle named by its center c, with points on it at the given angles (degrees).
  function CIRC(center, r, onIt, objects, extra, c = 'P') {
    const points = { [c]: center };
    for (const [n, deg] of Object.entries(onIt)) points[n] = { circ: c, deg };
    return fig(points, objects, Object.assign({ circles: [{ c, r }] }, extra || {}));
  }
  const S2 = (a, b) => ({ kind: 'segment', a, b }), L2 = (a, b) => ({ kind: 'line', a, b });
  const arcOf = (a, b, more) => Object.assign({ c: 'P', a, b }, more || {});
  const arcL = (arc, text) => ({ arc, text });
  // A radius, a diameter and a chord.
  const CHORDS = () => CIRC(p2(8, 7), 5, { A: 60, B: 150, C: 330, D: 205, E: 285 }, [S2('P', 'A'), S2('B', 'C'), S2('D', 'E')]);
  // A radius PT, the tangent line JK at T, and a secant FG.
  const TAN_LINES = () => { const f = CIRC(p2(7, 7.5), 4.5, { T: 270, F: 30, G: 120 }, [S2('P', 'T'), L2('J', 'K'), L2('F', 'G')], { angles: [A3('PTK')] });
    f.points.K = { tanLine: 'T', circ2: 'P', d: 5 }; f.points.J = { tanLine: 'T', circ2: 'P', d: -5 }; return f; };
  // Tangent line JK at T, perpendicular to radius PT.
  const TAN_ONE = () => { const f = CIRC(p2(7, 7), 4.5, { T: 0 }, [S2('P', 'T'), L2('J', 'K')], { angles: [A3('PTK')] });
    f.points.K = { tanLine: 'T', circ2: 'P', d: 4 }; f.points.J = { tanLine: 'T', circ2: 'P', d: -4 }; return f; };
  // Two tangents from Q touching ⊙P at S and T. With QP = 2r, m∠SQT = 60°.
  // Rays from Q through the points of tangency: a tangent keeps going past the one point where it
  // touches the circle. The segments QS and QT stay too (the tangent segments that are congruent);
  // the rays come last, so no task's figure numbers change.
  const TAN_RAYS = () => [{ kind: 'ray', a: 'Q', b: 'S' }, { kind: 'ray', a: 'Q', b: 'T' }];
  function TWO_TAN(qx = 14) {
    const f = fig({ P: p2(6, 7), Q: p2(qx, 7), S: { tanFrom: 'Q', circ2: 'P', side: 1 }, T: { tanFrom: 'Q', circ2: 'P', side: -1 } },
      [S2('Q', 'S'), S2('Q', 'T'), S2('P', 'Q'), S2('P', 'S'), S2('P', 'T'), ...TAN_RAYS()],
      { circles: [{ c: 'P', r: 4 }], angles: [A3('SQP'), A3('PQT'), A3('PSQ'), A3('QTP')], ticks: true });
    return f;
  }
  // Circumscribed ∠SQT: both sides tangent to ⊙P, with m∠SQT = theta, and central ∠SPT (180 - theta).
  function CIRCUM(theta, extra) {
    const d = 4 / Math.sin(theta / 2 * Math.PI / 180);
    return fig({ P: p2(6, 7), Q: p2(6 + d, 7), S: { tanFrom: 'Q', circ2: 'P', side: 1 }, T: { tanFrom: 'Q', circ2: 'P', side: -1 } },
      [S2('Q', 'S'), S2('Q', 'T'), S2('P', 'S'), S2('P', 'T'), ...TAN_RAYS()], Object.assign({ circles: [{ c: 'P', r: 4 }], angles: [A3('SQT'), A3('SPT'), A3('PSQ'), A3('QTP')] }, extra || {}));
  }
  const ANGLE_TYPES = ['A Central Angle', 'An Inscribed Angle', 'A Circumscribed Angle'];
  // Inscribed ∠ABC with vertex B on the circle; its intercepted arc AC is the one away from B.
  function INSC(a, b, c, more, extra) {
    const { objects = [], ...rest } = extra || {};
    return CIRC(p2(8, 7), 5, Object.assign({ A: a, B: b, C: c }, more || {}), [S2('B', 'A'), S2('B', 'C')].concat(objects), Object.assign({ angles: [A3('ABC')] }, rest));
  }

    // P in the middle keeps Q between C and D for every d from 50 to 130 degrees.

    const Q0 = polar(P0, r, 360 - d);              // down and to the right, so m∠APE = d

  // ---------- Bridges: reasons, proofs and congruence shortcuts ----------
  // Give the Reason: a true statement about the figure (its claim is checked in the tests) and the
  // definition, postulate, theorem or property behind it.
  const reason = (ask, claim, answer, options, fig, why, hint) => ({ type: 'choose', ask, q: { c: 'reason', claim, answer, why, hint, g: claim.g, h: claim.h }, options, fig });
  // Complete the Proof: statements (with [s:AB] segment, [a:ABC] angle, [m:ABC] measure, [t:ABC]
  // triangle, [l:m] line tokens) and the reason for each, chosen from one list.
  const proof = (ask, rows, options, fig, done) => ({ type: 'proof', ask, rows, options, fig, done, hideMeasures: true });   // only the givens are marked
  const cong = (g, h) => ({ c: 'congruent', g: A3(g), h: A3(h) });

  // Which shortcut do the givens support? Sides are numbered by their first vertex in the
  // statement's order (side 0 joins vertices 0 and 1), angles by vertex. Shared sides and
  // vertical angles count as given but aren't drawn: students have to see them.
  function congCriteria(q) {
    const m = i => (i + 3) % 3;
    const S = new Set(q.sides || []), A = new Set(q.angles || []);
    if (q.shared != null) S.add(q.shared);
    if (q.vertical != null) A.add(q.vertical);
    if (q.right != null) A.add(q.right);
    const out = [];
    if (S.size === 3) out.push('SSS');
    if ([0, 1, 2].some(i => S.has(i) && S.has(m(i - 1)) && A.has(i))) out.push('SAS');
    if ([0, 1, 2].some(i => A.has(i) && A.has(m(i + 1)) && S.has(i))) out.push('ASA');
    if ([0, 1, 2].some(i => A.has(i) && A.has(m(i + 1)) && [...S].some(s => s !== i))) out.push('AAS');
    if (q.right != null && S.has(m(q.right + 1)) && (S.has(q.right) || S.has(m(q.right - 1)))) out.push('HL');
    return out;
  }
  // The marks a set of givens puts on both triangles: 1, 2, 3 ticks for the given side pairs, 1, 2,
  // 3 arcs for the given angle pairs, a box for right angles.
  function critMarks(q) {
    const [t, u] = q.stmt.map(A3), marks = [];
    const side = (tri, i) => [tri[i], tri[(i + 1) % 3]], ang = (tri, i) => [tri[(i + 2) % 3], tri[i], tri[(i + 1) % 3]];
    (q.sides || []).forEach((i, k) => marks.push({ seg: side(t, i), ticks: k + 1 }, { seg: side(u, i), ticks: k + 1 }));
    (q.angles || []).forEach((i, k) => marks.push({ angle: ang(t, i), arcs: k + 1 }, { angle: ang(u, i), arcs: k + 1 }));
    if (q.right != null) marks.push({ angle: ang(t, q.right), right: true }, { angle: ang(u, q.right), right: true });
    return marks;
  }
  const CRIT = ['SSS', 'SAS', 'ASA', 'AAS', 'HL', 'Not Enough'];
  const critTask = (ask, fig, q) => ({ type: 'choose', ask, q: Object.assign({ c: 'crit' }, q), options: CRIT, hideMeasures: true, fig: Object.assign(fig, { marks: critMarks(q) }) });
  // Kite ABCD split by BD into △ABD and △CBD, sharing side BD.
  const KITE = () => fig({ A: p2(3, 7), B: p2(10, 12), C: p2(17, 7), D: p2(10, 1) }, [S2('A', 'B'), S2('B', 'C'), S2('C', 'D'), S2('D', 'A'), S2('B', 'D')],
    { triangles: [tri('ABD'), tri('CBD')], angles: Geom.triAngles(tri('ABD')).concat(Geom.triAngles(tri('CBD'))) });
  // Segments AD and BC cross at their shared midpoint E, making △AEB and △DEC.
  const BOWTIE = () => fig({ A: p2(4, 11), B: p2(5, 2), C: p2(15, 12), D: p2(16, 3), E: p2(10, 7) }, [S2('A', 'D'), S2('B', 'C'), S2('A', 'B'), S2('C', 'D')],
    { triangles: [tri('AEB'), tri('DEC')], angles: Geom.triAngles(tri('AEB')).concat(Geom.triAngles(tri('DEC'))) });
  const HL_PAIR = () => PAIR(p2(2, 3), p2(8, 3), p2(2, 11), p2(18, 3), p2(12, 3), p2(18, 11));

  const B1_REASONS = ['Vertical Angles Theorem', 'Linear Pair Postulate', 'Corresponding Angles Postulate', 'Transitive Property'];
  const ALWAYS = ['Always', 'Only When m ∥ n'];
  const BRIDGE1 = {
    crossings: {
      title: 'One Crossing or Two?',
      tasks: [
        { type: 'show', ask: 'One Crossing or Two?', fig: TRANS(2), names: [N('angle', 'APE'), N('angle', 'QPB'), N('angle', 'CQP')],
          say: 'Angles at one crossing, like ∠APE and ∠QPB, are always related: vertical angles and linear pairs. Angles at two different crossings, like ∠APE and ∠CQP, are related only when m ∥ n.' },
        { type: 'choose', ask: '∠APE and ∠EPB Are Related', q: { c: 'always', g: A3('APE'), h: A3('EPB') }, options: ALWAYS, fig: TRANS(2) },
        { type: 'choose', ask: '∠APE and ∠CQP Are Related', q: { c: 'always', g: A3('APE'), h: A3('CQP') }, options: ALWAYS, fig: TRANS(2) },
        { type: 'choose', ask: '∠APE and ∠QPB Are Related', q: { c: 'always', g: A3('APE'), h: A3('QPB') }, options: ALWAYS, fig: TRANS(2) },
        { type: 'choose', ask: '∠QPB and ∠CQP Are Related', q: { c: 'always', g: A3('QPB'), h: A3('CQP') }, options: ALWAYS, fig: TRANS(2) },
        { type: 'mistake', ask: 'Line m Is Not Parallel to Line n. Tap the False Statement', fig: TRANS(2),
          claims: [{ c: 'pairIs', g: A3('APE'), h: A3('EPB'), name: 'linear pair' }, { c: 'congruent', g: A3('APE'), h: A3('QPB') }, { c: 'congruent', g: A3('APE'), h: A3('CQP') }] },
      ],
    },
    reasons: {
      title: 'Give the Reason',
      tasks: [
        { type: 'show', ask: 'Every Step Needs a Reason', fig: transAt(70), names: [N('angle', 'APE'), N('angle', 'QPB')],
          say: 'A reason is a definition, a postulate, a theorem or a property. ∠APE ≅ ∠QPB because of the Vertical Angles Theorem.' },
        reason('∠APE ≅ ∠QPB. Why?', cong('APE', 'QPB'), 'Vertical Angles Theorem', B1_REASONS, transAt(70), 'They are vertical angles, and vertical angles are congruent.'),
        reason('Line m ∥ Line n, So ∠APE ≅ ∠CQP. Why?', cong('APE', 'CQP'), 'Corresponding Angles Postulate', B1_REASONS, transAt(70), 'They are corresponding angles, and the lines are parallel.'),
        reason('m∠APE + m∠EPB = 180°. Why?', { c: 'supp', g: A3('APE'), h: A3('EPB') }, 'Linear Pair Postulate', B1_REASONS, transAt(70), 'They form a linear pair, so they are supplementary.'),
        proof('Line m ∥ Line n. Prove ∠QPB ≅ ∠CQP', [
          { s: '[l:m] ∥ [l:n]', r: 'Given', claim: { c: 'lineRel', a: 'm', b: 'n', rel: 'parallel' } },
          { s: '[a:APE] ≅ [a:CQP]', r: 'Corresponding Angles Postulate', claim: cong('APE', 'CQP') },
          { s: '[a:APE] ≅ [a:QPB]', r: 'Vertical Angles Theorem', claim: cong('APE', 'QPB') },
          { s: '[a:QPB] ≅ [a:CQP]', r: 'Transitive Property', claim: cong('QPB', 'CQP') },
        ], ['Given'].concat(B1_REASONS), transAt(70), 'Proved: alternate interior angles on parallel lines are congruent. That is the Alternate Interior Angles Theorem.'),
      ],
    },
  };

  // Bridge 2: Level 3's lines, crossed by more lines, make triangles, and Level 3's angle theorems
  // become the reasons the triangles are similar or congruent.
  // m ∥ n (through A, B and C, D), cut by AD and BC, which cross at E between them: △ABE above E
  // and △DCE below it. The lower triangle is k times the upper one (k = 1: congruent).
  const PAR_BOWTIE = (k = 2, extra) => {
    const A = p2(6, 11), B = p2(10, 11), E = p2(8, 11 - 9 / (1 + k));
    const D = p2(E.x + k * (E.x - A.x), E.y + k * (E.y - A.y)), C = p2(E.x + k * (E.x - B.x), E.y + k * (E.y - B.y));
    return fig({ A, B, C, D, E }, [Object.assign(L2('A', 'B'), { label: 'm' }), Object.assign(L2('C', 'D'), { label: 'n' }), L2('A', 'D'), L2('B', 'C')],
      Object.assign({ triangles: [tri('ABE'), tri('DCE')], angles: Geom.triAngles(tri('ABE')).concat(Geom.triAngles(tri('DCE'))), marks: PAR_MN(), labelDir: { E: [1, 0] } }, extra || {}));
  };
  const PAR_MN = () => [{ par: ['A', 'B'], at: 1.6 }, { par: ['C', 'D'], at: 1.25 }];
  // The same crossing lines with n tilted, so m and n are not parallel: only the vertical angles
  // match, and the triangles are neither similar nor congruent.
  const NOPAR_BOWTIE = () => fig({ A: p2(6, 11), B: p2(10, 11), E: p2(8, 8), D: p2(12, 2), C: p2(5, 3.5) },

        { type: 'choose', ask: 'DE Looks Parallel to BC, but Nothing Says So. Is △ADE ∼ △ABC Proved?', q: { c: 'fixed', answer: 'Not Proved', why: 'The Corresponding Angles Postulate needs DE ∥ BC to be given, with arrows or in words. Looking parallel is never a reason.', hint: 'What would you need to be given before using corresponding angles?' },

  const B3_REASONS = ['Definition of Circle', 'Isosceles Triangle Theorem', 'Exterior Angle Theorem', 'Substitution Property', 'Given'];
  const ISO_CIRC = extra => CIRC(p2(8, 7), 5, { A: 220, B: 320 }, [S2('P', 'A'), S2('P', 'B'), S2('A', 'B')], Object.assign({ triangles: [tri('PAB')], angles: Geom.triAngles(tri('PAB')) }, extra || {}));
  // Diameter BD through P, and A on the circle: the exterior angle ∠APD of △PAB is the central angle.
  const HALF = extra => CIRC(p2(8, 7), 5, { B: 90, D: 270, A: 200 }, [S2('B', 'D'), S2('B', 'A'), S2('P', 'A')], Object.assign({ angles: [A3('APD'), A3('PBA')] }, extra || {}));
  const BRIDGE3 = {
    inside: {

      tasks: [
        // A circle can go around any angle (centered at its vertex) and any triangle (through its corners).
        { type: 'show', ask: 'A Circle Around an Angle', hideMeasures: true, names: [N('angle', 'ABC')],

          say: 'Put the compass point on the vertex, B, and draw a circle. ∠ABC is now a central angle: its sides cut off arc AC, and the arc has the same measure as the angle.' },
        { type: 'show', ask: 'A Circle Around a Triangle', hideMeasures: true, names: [N('triangle', 'ABC')],

          say: 'Every triangle has exactly one circle through its three corners. Its center, P, is the same distance from A, B and C. Each angle is now an inscribed angle: ∠ACB is half of arc AB, the arc across from it.' },
        { type: 'show', ask: 'Two Radii Make an Isosceles Triangle', fig: ISO_CIRC(), names: [N('triangle', 'PAB')],
          say: 'PA and PB are radii, so PA ≅ PB. That makes △PAB isosceles, so its base angles are congruent: ∠PAB ≅ ∠PBA.' },

        proof('Prove m∠APD = 2 · m∠PBA', [
          { s: '[s:PA] ≅ [s:PB]', r: 'Definition of Circle', claim: { c: 'segEq', s1: ['P', 'A'], s2: ['P', 'B'] } },
          { s: '[a:PAB] ≅ [a:PBA]', r: 'Isosceles Triangle Theorem', claim: cong('PAB', 'PBA') },

        { type: 'show', ask: 'An Angle in a Semicircle', fig: INSC(180, 60, 0, null, { objects: [S2('A', 'C'), S2('P', 'B')] }), names: [N('angle', 'ABC')],
          say: 'AC is a diameter. Radius PB splits △ABC into two isosceles triangles, and the angles of △ABC add to 180°, so m∠ABC = 90°.' },
        reason('AC Is a Diameter, So m∠ABC = 90°. Why?', { c: 'mIs', g: A3('ABC'), deg: 90 }, 'Inscribed Angle Theorem', ['Inscribed Angle Theorem', 'Tangent Theorem', 'Vertical Angles Theorem', 'Given'], INSC(180, 60, 0, null, { objects: [S2('A', 'C')] }), 'An inscribed angle on a semicircle is a right angle.'),
        { type: 'measure', ask: 'AC Is a Diameter. Find the Measure of ∠BCA', hideMeasures: true, hint: '∠ABC is a right angle, and the three angles of △ABC add to 180°.',
          fig: CIRC(p2(8, 7), 5, { A: 180, B: 110, C: 0 }, [S2('A', 'C'), S2('A', 'B'), S2('B', 'C')], { angles: [A3('BAC'), A3('ABC'), A3('BCA')], targetAngle: A3('BCA'), labels: [angL('BAC', '55°')] }) },
      ],
    },
  };

  // ---------- Explore, one sandbox per level ----------
  // Level 2: two lines crossing at E. Every point moves: A and B swing the lines, C and D slide
  // along them, and E moves the crossing. Vertical angles stay congruent through all of it.
  const EXPLORE2 = fig({ E: E0, A: { x: 4, y: 5 }, C: { on: ['A', 'E'], t: 2 }, B: { x: 8, y: 12 }, D: { on: ['B', 'E'], t: 2 } },
    [{ kind: 'line', a: 'A', b: 'C' }, { kind: 'line', a: 'B', b: 'D' }],
    { angles: [A3('AEB'), A3('BEC'), A3('CED'), A3('DEA')], crossing: { at: 'E', lines: [['A', 'C'], ['B', 'D']] } });
  // Level 3: lines m, n and t each move on their own. Drag A or B to move m, C or D to move n,
  // and slide P along m or Q along n to move t. P and Q are always where t crosses m and n.
  const EXPLORE3 = fig({
    A: { x: 3, y: 10 }, B: { x: 17, y: 10 }, P: { on: ['A', 'B'], t: 5 / 14 },
    C: { x: 3, y: 4 }, D: { x: 16, y: 6 }, Q: { on: ['C', 'D'], t: 9 / 13 },
    E: { on: ['P', 'Q'], t: -0.25 }, F: { on: ['P', 'Q'], t: 1.25 },
  }, [
    { kind: 'line', a: 'A', b: 'B', label: 'm' }, { kind: 'line', a: 'C', b: 'D', label: 'n' }, { kind: 'line', a: 'E', b: 'F', label: 't' },
  ], {
    transversal: { l: ['A', 'B'], m: ['C', 'D'], t: ['E', 'F'], P: 'P', Q: 'Q' },
    angles: ['APE', 'EPB', 'BPQ', 'QPA', 'CQP', 'PQD', 'DQF', 'FQC'].map(A3),
  });
  const PAR3 = [{ at: 'D', dir: 'par', of: ['A', 'B'] }, { at: 'C', dir: 'par', of: ['A', 'B'] }, { at: 'B', dir: 'par', of: ['C', 'D'] }, { at: 'A', dir: 'par', of: ['C', 'D'] }];
  // Level 4: two triangles, △ABC and △DEF. Every vertex moves, and each one can snap to make its
  // triangle isosceles, right or equilateral, so every type by sides and by angles is reachable.
  // Ticks and arcs are shared, so matching sides and angles show across the two triangles.
  const EXPLORE4 = (() => {
    const f = TRI({ x: 2, y: 3 }, { x: 9, y: 3 }, { x: 4, y: 9 }), g = TRI({ x: 11, y: 4 }, { x: 17, y: 3 }, { x: 15, y: 10 }, 'DEF');
    return fig(Object.assign(f.points, g.points), f.objects.concat(g.objects),
      { triangles: f.triangles.concat(g.triangles), angles: f.angles.concat(g.angles) });
  })();
  // Level 5: ⊙P with inscribed ∠ABC and central ∠APC on the same arc, and two tangents from Q.
  // A, B and C slide around the circle; P moves the whole circle; Q moves outside it.
  const EXPLORE5 = (() => {
    const f = CIRC(p2(6, 7), 4.5, { A: 210, B: 120, C: 330 }, [S2('B', 'A'), S2('B', 'C'), S2('P', 'A'), S2('P', 'C'), S2('Q', 'S'), S2('Q', 'T'), S2('P', 'S'), S2('P', 'T'), ...TAN_RAYS()],
      { angles: [A3('ABC'), A3('APC'), A3('SQT'), A3('SPT'), A3('PSQ'), A3('QTP')], arcs: [arcOf('A', 'C', { opp: 'B' }), arcOf('S', 'T'), arcOf('A', 'B', { opp: 'C' }), arcOf('B', 'C', { opp: 'A' })], ticks: true,
        // A tangent is perpendicular to the radius at the point of tangency: part of what a tangent is, so always marked.
        marks: [{ angle: A3('PSQ'), right: true }, { angle: A3('QTP'), right: true }] });
    Object.assign(f.points, { Q: p2(16, 7), S: { tanFrom: 'Q', circ2: 'P', side: 1 }, T: { tanFrom: 'Q', circ2: 'P', side: -1 } });
    return f;
  })();
  // Magnets that pull vertex p of a triangle into shape against its other two vertices, q and r.
  const magnetsFor = (p, q, r) => [{ apex: [q, r] }, { bis: [q, r] }, { at: q, dir: 'perp', of: [q, r] }, { at: r, dir: 'perp', of: [q, r] }].map(m => Object.assign(m, { for: p }));
  const TRI_MAGNETS = ['ABC', 'BCA', 'CAB', 'DEF', 'EFD', 'FDE'].flatMap(s => magnetsFor(...s.split('')));

  const LEVELS = [
    { key: '1', title: 'Level 1: Lines, Segments, Rays and Planes', parts: LEVEL1, algebra: ALGEBRA[1],
      explore: () => ({ type: 'explore', ask: 'Explore', fig: EXPLORE, tools: ['move', 'segment', 'ray', 'line'], movable: 'all', planeToggle: true }) },
    { key: '2', title: 'Level 2: Angles', parts: LEVEL2, algebra: ALGEBRA[2],
      explore: () => ({ type: 'explore', ask: 'Explore', fig: EXPLORE2, tools: ['move'], movable: 'all' }) },
    { key: 'b1', title: 'Bridge 1: One Crossing or Two?', parts: BRIDGE1, bridge: true },
    { key: '3', title: 'Level 3: Parallel, Perpendicular, and Transversal', parts: LEVEL3, algebra: ALGEBRA[3],
      explore: () => ({ type: 'explore', ask: 'Explore', fig: EXPLORE3, tools: ['move'], movable: ['A', 'B', 'C', 'D', 'P', 'Q'], magnets: PAR3 }) },
    // Bridge 2 gives the triangle basics and similarity; Level 4 puts them to work in line figures,
    // with congruence and proofs (Jon, 2026-09-26).
    { key: 'b2', title: 'Bridge 2: From Lines to Triangles', bridge: true,
      parts: { naming: LEVEL4.naming, classify: LEVEL4.classify, angles: B2_ANGLES, similar: BRIDGE2.similar } },
    { key: '4', title: 'Level 4: Lines That Make Triangles', algebra: ALGEBRA[4],
      parts: { makes: BRIDGE2.makes, congSim: LEVEL4.congSim, congruent: BRIDGE2.congruent, decide: BRIDGE2.decide },
      explore: () => ({ type: 'explore', ask: 'Explore', fig: EXPLORE4, tools: ['move'], movable: 'all', magnets: TRI_MAGNETS }) },
    { key: 'b3', title: 'Bridge 3: Triangles Inside Circles', parts: BRIDGE3, bridge: true },
    { key: '5', title: 'Level 5: Circles', parts: LEVEL5, algebra: ALGEBRA[5],
      explore: () => ({ type: 'explore', ask: 'Explore', fig: EXPLORE5, tools: ['move'], movable: ['P', 'A', 'B', 'C', 'Q'], tangentToggle: true }) },
  ];

  const EXPLORE = fig(
    { A: { x: 2, y: 3 }, B: { x: 7, y: 5 }, C: { on: ['A', 'B'], t: 2 }, D: { x: 4, y: 11 }, E: { x: 10, y: 11 }, F: { x: 16, y: 3 } },
    [{ kind: 'line', a: 'A', b: 'B' }, { kind: 'segment', a: 'D', b: 'E' }, { kind: 'ray', a: 'F', b: 'E' }]);

  // ---------- Checking a typed name ----------
  // Capital and lowercase letters are part of the notation (a learning target), so a right answer
  // in the wrong case is "Almost" with a one-tap fix: the student still makes the change.
  const CASE = {
    point: 'Points are named with capital letters.',
    plane: 'A plane’s letter is a capital.',
    line: 'A line’s one-letter name is lowercase.',
  };
  const caseFix = (kind, pts, rule) => ({ status: 'almost', fix: { kind, pts }, message: 'Almost. ' + rule });

  // A plane's letter (plane N) and three points in it that aren't on one line (plane ABD) are
  // both correct names, on every task.
  function checkPlaneName(f, target, r) {
    if (r.kind && r.kind !== 'plane') return { status: 'bad', message: `A ${r.kind} is part of a plane, not the whole plane. Name the plane.` };
    if (!r.kind) return { status: 'ask', message: 'Which one? Start with the word plane.' };
    const res = Geom.resolvePlane(f, r.pts);
    if (res.error === 'noPoint') return { status: 'bad', message: `There's no point ${res.pt} in this figure.` };
    if (res.error === 'noPlane') return { status: 'bad', message: `This plane isn't labeled ${res.pt}. Look for its letter in the corner.` };
    if (res.error === 'collinear') return { status: 'almost', message: `${r.pts.join(', ')} are on one line, and many planes go through one line. Use three points that are not on one line.` };
    if (res.error === 'notIn') return { status: 'bad', message: `${res.pt} isn't in plane ${res.plane}.` };
    if (res.label !== target.label) return { status: 'bad', message: 'That names a different plane.' };
    if (r.lowercase) return caseFix('plane', r.pts, r.pts.length === 1 ? CASE.plane : CASE.point);
    const others = Geom.planeNames(f, target.label).map(p => p.join('')).filter(p => p !== r.pts.join(''));
    return { status: 'good', kind: 'plane', pts: r.pts, others, message: 'Yes.' };
  }

  // "line m": a line's own one-letter name, which is lowercase.
  function checkLineLetter(f, target, r) {
    if (target.kind !== 'line') return { status: 'bad', message: `One letter names a line. A ${target.kind} is named with two points.` };
    if (!target.label) return { status: 'bad', message: 'This line has no letter in the diagram. Name it with two of its points.' };
    if (r.letter.toLowerCase() !== target.label.toLowerCase()) return { status: 'bad', message: 'That letter names a different line.' };
    if (r.letter !== target.label) return caseFix('line', [target.label], CASE.line);
    return { status: 'good', kind: 'line', pts: [target.label], others: Geom.names(f, target).map(p => p.join('')), message: 'Yes.' };
  }

  function checkName(f, target, input) {
    if (target.kind === 'triangle') return checkTriName(f, target.pts, input);
    const r = Notation.parse(input);
    // "JKL" or "M" on a plane task: the right idea, missing the word.
    if (target.kind === 'plane' && !r.kind && !Notation.parse('plane ' + input).error) return { status: 'ask', message: 'Which one? Start with the word plane.' };
    if (r.error) return { status: 'bad', message: r.error };
    if (target.kind === 'plane') return checkPlaneName(f, target, r);
    if (r.letter) return checkLineLetter(f, target, r);
    const missing = r.pts.find(p => !f.points[p]);
    if (missing) return { status: 'bad', message: `There's no point ${missing} in this figure.` };
    if (!r.kind) return { status: 'ask', message: `Which one? With no mark, ${r.pts.join('')} is a length. Add segment, ray or line.` };
    if (r.kind !== target.kind) return { status: 'bad', message: `A ${r.kind} ${K[r.kind].ends}. How many endpoints does this figure have?` };
    const typed = { kind: r.kind, a: r.pts[0], b: r.pts[1] };
    if (Geom.same(f, target, typed)) {
      if (r.lowercase) return caseFix(r.kind, r.pts, CASE.point);
      const others = Geom.names(f, target).map(p => p.join('')).filter(p => p !== r.pts.join(''));
      if (target.label) others.unshift(target.label);
      return { status: 'good', kind: r.kind, pts: r.pts, others, message: 'Yes.' };
    }
    if (r.kind === 'ray' && Geom.same(f, target, { kind: 'ray', a: r.pts[1], b: r.pts[0] })) {
      return { status: 'almost', fix: { kind: 'ray', pts: [r.pts[1], r.pts[0]] }, message: `Almost. A ray is named endpoint first, and this one starts at ${r.pts[1]}.${r.lowercase ? ' ' + CASE.point : ''}` };
    }
    if (r.kind === 'segment' && !(target.a === r.pts[0] || target.b === r.pts[0]) !== !(target.a === r.pts[1] || target.b === r.pts[1])) {
      return { status: 'bad', message: 'A segment is named by its two endpoints.' };
    }
    return { status: 'bad', message: `That names a different ${r.kind}. Check which points are on it.` };
  }

  // ---------- Angles ----------
  const angleText = g => '∠' + g.join('');
  // Every correct three-point name of an angle: any point on each of its rays, vertex in the middle.
  function angleNames(f, g) {
    const pts = Object.keys(f.points), out = [];
    for (const p of pts) for (const q of pts) {
      if (p === q || p === g[1] || q === g[1]) continue;
      if (Geom.sameAngle(f, g, [p, g[1], q])) out.push([p, g[1], q]);
    }
    return out;
  }
  // Which of the figure's angles does a typed three-point name describe?
  const findAngle = (f, pts) => (f.angles || []).find(g => Geom.sameAngle(f, g, pts));

  function checkAngleName(f, target, input) {
    const r = Notation.parse(input);
    if (r.error) return { status: 'bad', message: r.error };
    if (r.kind !== 'angle') return { status: 'ask', message: 'Which one? Name an angle with the angle sign and three points, like ∠ABC.' };
    const missing = r.pts.find(p => !f.points[p]);
    if (missing) return { status: 'bad', message: `There's no point ${missing} in this figure.` };
    const v = target[1];
    if (r.pts.length === 1) {
      return r.pts[0] === v ? caseFix('angle', target, `Name angles with three points, vertex in the middle: ${angleText(target)}.`)
        : { status: 'bad', message: `The vertex of this angle is ${v}.` };
    }
    if (r.measure) return caseFix('angle', r.pts, `m${angleText(r.pts)} is the measure, a number. The angle itself is ${angleText(r.pts)}.`);
    if (!Geom.sameAngle(f, target, r.pts)) {
      if (r.pts.includes(v) && r.pts[1] !== v) return { status: 'bad', message: `The vertex, ${v}, goes in the middle.` };
      return { status: 'bad', message: 'That names a different angle.' };
    }
    if (r.lowercase) return caseFix('angle', r.pts, CASE.point);
    const others = angleNames(f, target).map(p => p.join('')).filter(p => p !== r.pts.join(''));
    return { status: 'good', kind: 'angle', pts: r.pts, others, message: 'Yes.' };
  }

  // Writing a measure: m∠ABC = 75°. The m matters: ∠ABC is the angle, m∠ABC its measure.
  function checkMeasure(f, target, input, hint) {
    const r = Notation.parse(input);
    if (r.error) return { status: 'bad', message: r.error };
    if (r.kind !== 'angle') return { status: 'ask', message: 'Write the measure like m∠ABC = 40°.' };
    const deg = Math.round(Geom.angleDeg(f, ...target));
    const name = r.pts.length === 3 ? r.pts : target;
    if (r.pts.length === 3 && !Geom.sameAngle(f, target, r.pts)) return { status: 'bad', message: 'That names a different angle.' };
    const fix = { kind: 'measure', pts: name, value: deg };
    if (r.value == null) return { status: 'ask', message: 'Add the measure: = and the number of degrees.' };
    if (Math.abs(r.value - Geom.angleDeg(f, ...target)) > 0.5) {
      // The number of a different angle marked on the figure: say whose it is.
      const given = (f.labels || []).find(lb => lb.angle && parseFloat(lb.text) === r.value && !Geom.sameAngle(f, lb.angle, target));
      if (given) return { status: 'bad', message: `${r.value}° is m${angleText(given.angle)}, not m${angleText(target)}. ${hint || ''}`.trim() };
      return { status: 'bad', message: hint ? 'Check the number. ' + hint : 'Check the number: the Measurements panel shows it.' };
    }
    if (r.pts.length === 1) return { status: 'almost', fix, message: `Almost. Name the angle with three points, vertex in the middle.` };
    if (!r.measure) return { status: 'almost', fix, message: `Almost. ${angleText(name)} is the angle. Its measure is m${angleText(name)}.` };
    if (r.lowercase) return { status: 'almost', fix, message: 'Almost. ' + CASE.point };
    return { status: 'good', kind: 'measure', pts: name, value: deg, message: 'Yes.' };
  }

  // Name the angle that forms a given pair with a given angle.
  function checkNamePair(f, given, want, input) {
    const r = Notation.parse(input);
    if (r.error) return { status: 'bad', message: r.error };
    if (r.kind !== 'angle' || r.pts.length !== 3) return { status: 'ask', message: 'Name the angle with the angle sign and three points, like ∠ABC.' };
    const missing = r.pts.find(p => !f.points[p]);
    if (missing) return { status: 'bad', message: `There's no point ${missing} in this figure.` };
    const typed = findAngle(f, r.pts);
    if (!typed) return { status: 'bad', message: 'The vertex goes in the middle, and both other points on the angle’s rays.' };
    const pair = Geom.anglePair(f, given, typed);
    if (pair !== want) return { status: 'bad', message: pair ? `${angleText(r.pts)} and ${angleText(given)} are ${pairWords(pair)}.` : `${angleText(r.pts)} and ${angleText(given)} don't form a named pair.` };
    if (r.lowercase) return caseFix('angle', r.pts, CASE.point);
    return { status: 'good', kind: 'angle', pts: r.pts, others: angleNames(f, typed).map(p => p.join('')).filter(p => p !== r.pts.join('')), message: 'Yes.' };
  }
  const pairWords = p => (p === 'vertical' ? 'vertical angles' : p === 'linear pair' ? 'a linear pair' : p + ' angles');

  // ---------- Triangles ----------
  const triText = t => '△' + t.join('');
  const perms = t => [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]].map(ix => ix.map(i => t[i]));
  // △ABC: the triangle sign and its three vertices, in any order.
  function checkTriName(f, t, input) {
    if (/^\s*[A-Za-z]\s*[A-Za-z]\s*[A-Za-z]\s*$/.test(input)) return { status: 'ask', message: 'Which one? Put the triangle sign, △, before the three vertices.' };
    const r = Notation.parse(input);
    if (r.error) return { status: 'bad', message: r.error };
    if (r.kind === 'angle' && r.pts.length === 3) return { status: 'bad', message: `${angleText(r.pts)} is one angle of the triangle. Name the whole triangle with △.` };
    if (r.kind !== 'triangle') return { status: 'ask', message: 'Name it with the triangle sign and its three vertices, like △ABC.' };
    const missing = r.pts.find(p => !f.points[p]);
    if (missing) return { status: 'bad', message: `There's no point ${missing} in this figure.` };
    if (Geom.collinearPts(f, ...r.pts)) return { status: 'bad', message: `${r.pts.join(', ')} are on one line, so they don't make a triangle.` };
